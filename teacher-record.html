<style>

r(--sky);color:#397386;font-size:11px}.analysis-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:16px}.analysis-card{padding:15px;border-radius:14px;background:#f7fbfa}.analysis-card span{color:var(--muted);font-size:12px}.analysis-card b{display:block;margin-top:6px;font-size:17px}.analysis-card p{margin:7px 0 0;color:#48636b;font-size:13px}.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.stage-list{display:grid;gap:9px;margin-top:16px}.stage{display:grid;grid-template-columns:110px 1fr 62px;gap:10px;align-items:center}.stage span,.stage b{font-size:13px}.stage b{text-align:right;color:var(--teal-dark)}.bar{height:8px;overflow:hidden;border-radius:999px;background:#edf3f1}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9be6c5,#31ba8d)}.attendance-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.attendance-summary div{padding:14px;border-radius:12px;background:var(--sky)}.attendance-summary b,.attendance-summary span{display:block}.attendance-summary b{font-size:22px}.attendance-summary span{color:var(--muted);font-size:12px}.name-block{margin-top:15px}.name-block b{display:block;margin-bottom:7px}.name-list{display:flex;flex-wrap:wrap;gap:7px}.name-list span{padding:6px 9px;border-radius:999px;background:#f3f8f6;color:#48636b;font-size:12px}.name-list.absent span{background:var(--rose);color:#a24944}.student-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.student-tools input,.student-tools select{min-height:42px;padding:0 12px;border:1px solid #cadee0;border-radius:10px;background:#fff;color:var(--ink);font:inherit}.student-tools input{flex:1;min-width:220px}.student-count{margin-left:auto;align-self:center;color:var(--muted);font-size:13px}.table-scroll{overflow:auto;margin-top:12px}.student-table{width:100%;min-width:890px;border-collapse:collapse}.student-table th,.student-table td{padding:13px 11px;border-bottom:1px solid #e8f0ee;text-align:left;vertical-align:top}.student-table th{color:#577079;font-size:12px}.student-table td{font-size:13px}.student-table small{display:block;margin-top:3px;color:var(--muted)}.status{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--mint);color:var(--teal-dark);font-size:11px;font-weight:700}.status.absent{background:var(--rose);color:#a24944}.status.partial{background:var(--amber);color:#9b6b13}.support-yes{color:#b25932;font-weight:700}.empty-row{text-align:center!important;color:var(--muted)}.manual-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.manual label{font-weight:700}.manual textarea{width:100%;min-height:116px;margin-top:7px;padding:11px;border:1px solid #cfe1dd;border-radius:11px;resize:vertical;font:inherit;color:var(--ink)}.save{margin-top:14px;padding:10px 16px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-weight:750;cursor:pointer}.save-state{margin-left:10px;color:var(--teal-dark);font-size:12px}.boundary{margin:14px 0 0;padding:11px 13px;border-radius:11px;background:#f5faf8;color:var(--muted);font-size:12px}.empty{padding:40px;text-align:center}@media(max-width:1000px){.facts{grid-template-columns:repeat(3,1fr)}.analysis-grid{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}.manual-grid{grid-template-columns:1fr}}@media(max-width:760px){.shell{width:min(100% - 24px,1180px);padding-top:14px}.top .brand{display:none}.anchor-nav{overflow-x:auto;white-space:nowrap}.facts{grid-template-columns:1fr 1fr}.analysis-grid{grid-template-columns:1fr}.panel-head{display:block}.source-tag{display:inline-flex;margin-top:8px}.student-tools{display:grid;grid-template-columns:1fr 1fr}.student-tools input,.student-count{grid-column:1/-1;margin-left:0}.attendance-summary{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}@media(max-width:420px){.hero,.panel{padding:18px}.facts,.attendance-summary,.student-tools{grid-template-columns:1fr}.student-tools input,.student-count{grid-colu <body><div class="app-shell record-detail-app"><aside class="sidebar" aria-label="老师端导航"></aside><main class="shell record-detail-shell"><header class="top"><div class="brand">云听 · 课堂记录详情</div><a class="back" href="teacher.html?view=records">← 返回课堂记录</a></header><div id="app"></div></main></div>
<script src="assets/demo-data.js?v=record-detail-1"></script>
<script src="assets/support-flow.js?v=flow-1"></script>
<script>
(function(){
'use strict';
window.YTSeedDemo&&window.YTSeedDemo.ensure();
var recordKeyName='yunting-class-records-v1',studentKey='yunting-class-students-v1',sessionId=new URLSearchParams(location.search).get('session'),app=document.getElementById('app'),stageDefs=[['进入课堂','enter'],['故事导入','story'],['和小悦悦聊聊','talk'],['心理能量补给','energy'],['成长训练场','playground'],['收束与尾声','closing']];
function read(key){try{var x=JSON.parse(localStorage.getItem(key))||[];return Array.isArray(x)?x:[]}catch(e){return[]}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]})}
function keyOf(x){return x&&x.sessionId?String(x.sessionId):'legacy-'+String(x&&x.at||'')+'-'+String(x&&x.title||'')}
function safeCount(v){var n=Number(v);return Number.isFinite(n)&&n>=0?Math.round(n):null}
function dateText(v){var d=new Date(v);return Number.isFinite(d.getTime())?d.toLocaleString('zh-CN'):'时间未记录'}
function durationText(a,b){var n=Math.round((Number(b)-Number(a))/60000);return Number.isFinite(n)&&n>0?n+' 分钟':'—'}
function reachedOf(item){var reached=Array.isArray(item.reachedStages)?item.reachedStages.slice():[],progress=item.stageProgress||{};Object.keys(progress).forEach(function(k){if(Number(progress[k])>0&&reached.indexOf(k)<0)reached.push(k)});return reached}
function render(){
 var records=read(recordKeyName),item=records.find(function(x){return keyOf(x)===sessionId})||(!sessionId&&records[0]);
 if(!item){app.innerHTML='<section class="panel empty"><h1>没有找到这条课堂记录</h1><p>它可能已被清理，或当前浏览器没有对应数据。</p></section>';return}
 var roster=read(studentKey).filter(function(x){return x.classId===item.classId}),activity=Array.isArray(item.studentActivity)?item.studentActivity:[],byStudent={};activity.forEach(function(x){byStudent[x.studentId]=x});
 var studentRows=roster.map(function(x){var a=byStudent[x.id]||null;return{student:x,activity:a}}),knownAttendance=activity.length>0,presentRows=studentRows.filter(function(x){return x.activity&&x.activity.present}),absentRows=studentRows.filter(function(x){return x.activity&&x.activity.present===false}),expected=safeCount(item.expectedStudents);if(expected==null)expected=roster.length||null;var actual=safeCount(item.actualStudents);if(knownAttendance)actual=presentRows.length;var absent=expected!=null&&actual!=null?Math.max(0,expected-actual):null,rate=expected&&actual!=null?Math.round(actual/expected*100):null;
 var reached=reachedOf(item),completed=stageDefs.filter(function(x){return reached.indexOf(x[1])>=0}).length,fullCount=activity.filter(function(x){return x.present&&Array.isArray(x.completedStages)&&x.completedStages.length>=stageDefs.length}).length,partialCount=activity.filter(function(x){return x.present&&Array.isArray(x.completedStages)&&x.completedStages.length>0&&x.completedStages.length<stageDefs.length}).length,supports=activity.filter(function(x){return x.supportRequest}).length;
 var bars=stageDefs.map(function(x){var done=reached.indexOf(x[1])>=0;return '<div class="stage"><span>'+esc(x[0])+'</span><div class="bar"><i style="width:'+(done?100:0)+'%"></i></div><b>'+(done?'已完成':'未记录')+'</b></div>'}).join('');
 var analysis=[
  ['课堂流程',completed+' / '+stageDefs.length+' 个环节',completed===stageDefs.length?'本堂课完成了现行课程的全部环节。':'请结合课堂实际情况补充未记录环节。'],
  ['学生完成情况',knownAttendance?(fullCount+' 人完整完成'):'数据未接入',knownAttendance?(partialCount?partialCount+' 人完成部分环节。':'到课学生均完成全部环节。'):'尚未接入逐人课堂进度。'],
  ['人员到场',rate==null?'—':rate+'% 出勤率',absent==null?'尚未接入真实到场数据。':(absent?absent+' 人未到场。':'全员到场。')],
  ['后续事项',supports+' 项主动提交',supports?'只进入老师人工回应流程，不在课堂记录中推断心理结论。':'本堂课没有新增学生主动提交事项。']
 ].map(function(x){return '<article class="analysis-card"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b><p>'+esc(x[2])+'</p></article>'}).join('');
 function names(rows,empty){return rows.length?rows.map(function(x){return '<span>'+esc(x.student.name||'未命名学生')+'</span>'}).join(''):'<span>'+empty+'</span>'}
 var tableRows=studentRows.map(function(row){var x=row.student,a=row.activity,stageCount=a&&Array.isArray(a.completedStages)?a.completedStages.length:0,status=!a?'未接入':(!a.present?'未到场':(stageCount>=stageDefs.length?'已完成':'部分完成')),cls=status==='未到场'?'absent':(status==='部分完成'?'partial':'');return '<tr class="student-row" data-name="'+esc(x.name||'')+'" data-attendance="'+(!a?'unknown':(a.present?'present':'absent'))+'"><td><b>'+esc(x.name||'未命名学生')+'</b><small>'+esc(x.studentNo||'—')+'</small></td><td><span class="status '+cls+'">'+status+'</span><small>'+(a?esc(a.connection||'连接状态未记录'):'未接入逐人数据')+'</small></td><td>'+(a&&a.present?(stageCount+' / '+stageDefs.length):'—')+'</td><td>'+esc(a&&a.participation||'暂无课堂参与记录')+'</td><td>'+esc(a&&a.observation||'暂无可追溯观察')+'</td><td>'+(a&&a.supportRequest?'<span class="support-yes">有，待老师回应</span>':'无')+'</td></tr>'}).join('');
 var obs=item.observations||{},demo=item.demo?'<span class="demo-chip">演示数据</span>':'';
 app.innerHTML='<section class="hero"><p class="eyebrow">'+esc(item.className||'班级未记录')+' · '+esc(item.status||'状态未记录')+demo+'</p><h1>'+esc(item.title||'未命名课程')+'</h1><p class="hero-sub">'+esc(dateText(item.at))+' 开始 · 课堂组织、到场与参与情况记录</p><div class="facts"><div class="fact"><b>'+esc(durationText(item.at,item.endedAt))+'</b><span>课堂时长</span></div><div class="fact"><b>'+(expected==null?'—':expected)+'</b><span>应到人数</span></div><div class="fact"><b>'+(actual==null?'—':actual)+'</b><span>实到人数</span></div><div class="fact"><b>'+(absent==null?'—':absent)+'</b><span>未到人数</span></div><div class="fact"><b>'+(rate==null?'—':rate+'%')+'</b><span>出勤率</span></div></div></section><nav class="anchor-nav" aria-label="课堂记录页内导航"><a href="#analysis">本堂课分析</a><a href="#attendance">人员到场</a><a href="#students">学生情况</a><a href="#notes">老师记录</a></nav><section class="panel" id="analysis"><div class="panel-head"><div><h2>本堂课分析</h2><p>仅汇总课堂流程、到场、参与和学生主动提交的数据。</p></div><span class="source-tag">可追溯课堂数据</span></div><div class="analysis-grid">'+analysis+'</div></section><div class="two-col"><section class="panel"><div class="panel-head"><div><h2>课程环节完成情况</h2><p>查看本堂课实际推进到哪些环节。</p></div></div><div class="stage-list">'+bars+'</div></section><section class="panel" id="attendance"><div class="panel-head"><div><h2>人员到场情况</h2><p>按班级名册核对本堂课到场情况。</p></div></div><div class="attendance-summary"><div><b>'+(expected==null?'—':expected)+'</b><span>班级应到</span></div><div><b>'+(actual==null?'—':actual)+'</b><span>实际到场</span></div><div><b>'+(absent==null?'—':absent)+'</b><span>未到场</span></div></div><div class="name-block"><b>已到场学生</b><div class="name-list">'+names(presentRows,'到场名单未接入')+'</div></div><div class="name-block"><b>未到场学生</b><div class="name-list absent">'+names(absentRows,knownAttendance?'无':'未到场名单未接入')+'</div></div></section></div><section class="panel" id="students"><div class="panel-head"><div><h2>每个学生的课堂情况</h2><p>展示到场、环节完成、课堂参与和主动求助；不展示私密对话全文。</p></div><span class="source-tag">'+studentRows.length+' 名学生</span></div><div class="student-tools"><input id="student-search" type="search" placeholder="搜索学生姓名"><select id="attendance-filter"><option value="all">全部学生</option><option value="present">已到场</option><option value="absent">未到场</option><option value="unknown">数据未接入</option></select><span class="student-count" id="student-count">共 '+studentRows.length+' 人</span></div><div class="table-scroll"><table class="student-table"><thead><tr><th>学生</th><th>到场状态</th><th>完成环节</th><th>课堂参与</th><th>课堂观察摘要</th><th>主动提交</th></tr></thead><tbody>'+tableRows+'<tr id="student-empty" hidden><td class="empty-row" colspan="6">没有符合条件的学生。</td></tr></tbody></table></div><p class="boundary">学生情况只来自本堂课可追溯的操作与老师记录，不能据此生成心理分数、诊断或风险等级。</p></section><section class="panel manual" id="notes"><div class="panel-head"><div><h2>老师课后记录 <small>选填</small></h2><p>如有必要，可补充课堂组织、公开互动和后续人工行动；无需每堂课填写。</p></div></div><div class="manual-grid"><label>课堂参与与组织<textarea id="obs-participation" placeholder="记录课堂节奏、设备情况、参与方式等">'+esc(obs.participation||'')+'</textarea></label><label>公开表达与课堂反馈<textarea id="obs-expression" placeholder="只记录公开表达或学生明确授权内容">'+esc(obs.expression||'')+'</textarea></label><label>需要继续跟进的事项<textarea id="obs-support" placeholder="记录后续人工行动，不填写自动诊断或风险等级">'+esc(obs.support||'')+'</textarea></label></div><button class="save" id="save-note">保存课后记录</button><span class="save-state" id="save-state"></span></section>';
 var search=document.getElementById('student-search'),filter=document.getElementById('attendance-filter'),count=document.getElementById('student-count');function apply(){var q=(search.value||'').trim().toLowerCase(),f=filter.value,n=0;document.querySelectorAll('.student-row').forEach(function(row){var show=(!q||row.dataset.name.toLowerCase().indexOf(q)>=0)&&(f==='all'||row.dataset.attendance===f);row.hidden=!show;if(show)n++});count.textContent='共 '+n+' 人';document.getElementById('student-empty').hidden=n!==0}search.oninput=apply;filter.onchange=apply;
 document.getElementById('save-note').onclick=function(){var next={participation:document.getElementById('obs-participation').value.trim(),expression:document.getElementById('obs-expression').value.trim(),support:document.getElementById('obs-support').value.trim()},updated=records.map(function(x){return keyOf(x)!==keyOf(item)?x:Object.assign({},x,{observations:next,observationUpdatedAt:Date.now()})});localStorage.setItem(recordKeyName,JSON.stringify(updated));document.getElementById('save-state').textContent='已保存'};
}
render();
})();
</script><script src="assets/teacher-ui.js?v=round7"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js?v=7").catch(function(){})}</script></body></html>
