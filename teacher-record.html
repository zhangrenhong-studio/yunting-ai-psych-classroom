<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>云听｜课堂详细记录</title>
<link rel="stylesheet" href="assets/support-flow.css?v=flow-1">
<style>
:root{--bg1:#f0fdf4;--bg2:#e0f2fe;--bg3:#faf5ff;--fallback:#f4f9f6;--ink:#23424c;--muted:#708992;--line:#dbece8;--teal:#168677;--mint:#e9faf2;--sky:#edf8ff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;background-color:var(--fallback);background-image:radial-gradient(circle at 50% -20%,var(--bg1),var(--bg2) 52%,var(--bg3));background-attachment:fixed}.shell{width:min(1120px,calc(100% - 40px));margin:auto;padding:28px 0 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900}.back{color:var(--teal);text-decoration:none}.hero,.panel{padding:24px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.9);box-shadow:0 20px 42px -38px rgba(17,88,80,.46)}.eyebrow{margin:0 0 7px;color:var(--teal);font-size:11px;font-weight:900;letter-spacing:.14em}.hero h1{margin:0;font-size:31px}.hero>p{margin:7px 0 0;color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.fact{padding:14px;border-radius:14px;background:var(--sky)}.fact b,.fact span{display:block}.fact b{font-size:22px}.fact span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-top:16px}.panel h2{margin:0;font-size:19px}.panel>p{color:var(--muted)}.stage-list{margin-top:13px}.stage{display:grid;grid-template-columns:105px 1fr 54px;gap:9px;align-items:center;padding:9px 0}.bar{height:8px;border-radius:999px;background:#edf3f2;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#a7f3d0,#34d399)}.stage b{text-align:right;color:var(--teal);font-size:12px}.support-stat{margin-top:13px;padding:15px;border-radius:14px;background:#f4fbf8}.support-stat strong{display:block;font-size:24px}.support-stat span{color:var(--muted);font-size:12px}.ai-panel{margin-top:16px}.analysis-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.analysis-head span{padding:5px 9px;border-radius:999px;background:#edf8ff;color:#39778d;font-size:11px;font-weight:900}.analysis-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:15px}.analysis-card{padding:15px;border:1px solid #dcebe7;border-radius:15px;background:#fbfefd}.analysis-card header{display:flex;align-items:center;justify-content:space-between;gap:8px}.analysis-card h3{margin:0;font-size:15px}.analysis-card em{padding:3px 7px;border-radius:999px;background:#e9faf2;color:#267565;font-size:10px;font-style:normal;font-weight:900}.analysis-card em.insufficient{background:#f1f4f4;color:#71858a}.analysis-card p{margin:9px 0 0;color:var(--ink);font-size:13px}.analysis-card small{display:block;margin-top:8px;color:var(--muted);font-size:11px}.analysis-rule{margin-top:13px;padding:11px 13px;border-radius:12px;background:#f4faf8;color:var(--muted);font-size:12px}.manual{margin-top:16px}.manual label{display:block;margin-top:12px;font-weight:800}.manual textarea{width:100%;min-height:76px;margin-top:6px;padding:11px;border:1px solid #cfe3df;border-radius:12px;resize:vertical;font:inherit;color:var(--ink);background:#fff}.save{margin-top:14px;padding:10px 15px;border:0;border-radius:11px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.save-state{margin-left:9px;color:var(--teal);font-size:12px}.boundary{margin-top:15px!important;padding:11px 13px;border-radius:12px;background:var(--sky);font-size:12px}.empty{padding:35px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.analysis-grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.analysis-grid{grid-template-columns:1fr}.analysis-head{display:block}.analysis-head span{display:inline-block;margin-top:8px}.shell{width:min(100% - 22px,1120px)}.facts{grid-template-columns:1fr 1fr}.stage{grid-template-columns:92px 1fr 48px}}
</style>
<link rel="stylesheet" href="assets/teacher-ui.css?v=unified-2">
</head>
<body><main class="shell"><header class="top"><div class="brand">云听 · 课堂详细记录</div><a class="back" href="teacher.html?view=records">← 返回课堂记录</a></header><div id="app"></div></main>
<script src="assets/support-flow.js?v=flow-1"></script>
<script>
(function(){
'use strict';
var key='yunting-class-records-v1',sessionId=new URLSearchParams(location.search).get('session'),app=document.getElementById('app'),stageDefs=[['进入课堂','enter'],['故事导入','story'],['和小悦悦聊聊','talk'],['心理能量补给','energy'],['成长训练场','playground'],['收束与尾声','closing']];
function all(){try{var x=JSON.parse(localStorage.getItem(key))||[];return Array.isArray(x)?x:[]}catch(e){return[]}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){var rows=all(),item=rows.find(function(x){return x.sessionId===sessionId})||(!sessionId&&rows[0]);if(!item){app.innerHTML='<section class="panel empty"><h1>还没有可查看的课堂记录</h1><p>老师结束课堂后，这里会保存课堂流程与人工观察。</p></section>';return}var expected=item.expectedStudents==null?'—':item.expectedStudents,actual=item.actualStudents==null?'未接入':item.actualStudents,rate=item.actualStudents==null||!item.expectedStudents?'—':Math.round(item.actualStudents/item.expectedStudents*100)+'%',reached=(item.reachedStages||[]).map(function(x){return x==='practice'?'energy':x}),progress=item.stageProgress||{},completed=stageDefs.filter(function(x){return reached.indexOf(x[1])>=0||(progress[x[1]]||0)>0}).length,supports=YTSupportFlow.all().filter(function(x){return x.sessionId===item.sessionId}).length,bars=stageDefs.map(function(x){var done=reached.indexOf(x[1])>=0||(progress[x[1]]||0)>0,p=done?100:0;return '<div class="stage"><span>'+x[0]+'</span><div class="bar"><i style="width:'+p+'%"></i></div><b>'+(done?'已到达':'未到达')+'</b></div>'}).join(''),obs=item.observations||{},analysis=[{name:'课堂参与与完成节奏',ready:true,text:'本场课堂已到达 '+completed+' / 6 个环节。',evidence:'来源：课堂场次与环节到达记录'},{name:'情绪表达主题',ready:supports>0,text:supports>0?'有 '+supports+' 条学生主动授权交给老师的表达。':'当前没有学生主动授权给老师的表达，不能推断情绪状态。',evidence:'来源：学生主动授权内容；不读取私密聊天与每日记录'},{name:'环境适应与同伴连接',ready:false,text:'本场课堂缺少足够、可授权的观察材料，暂不生成判断。',evidence:'需要多次课程、公开课堂行为或学生主动授权材料'},{name:'学习压力相关线索',ready:false,text:'当前课堂数据不足，不根据课程参与情况推断学习压力。',evidence:'需要主题相关课程证据与持续趋势'},{name:'自我调节策略使用',ready:reached.indexOf('energy')>=0,text:reached.indexOf('energy')>=0?'本场课堂已进入心理能量补给，可记录是否完成音乐聆听；不据此判断调节效果。':'本场课堂尚未到达心理能量补给，暂无观察材料。',evidence:'来源：心理能量补给音乐聆听环节到达与完成记录'},{name:'主动求助与支持偏好',ready:supports>0,text:supports>0?'发现 '+supports+' 条学生明确提交的支持请求，应进入人工回应流程。':'当前没有来自本课堂的主动求助记录。',evidence:'来源：想让老师知道 / 现在需要大人帮助'}],analysisHtml=analysis.map(function(x){return '<article class="analysis-card"><header><h3>'+esc(x.name)+'</h3><em class="'+(x.ready?'':'insufficient')+'">'+(x.ready?'有课堂证据':'数据不足')+'</em></header><p>'+esc(x.text)+'</p><small>'+esc(x.evidence)+'</small></article>'}).join('');app.innerHTML='<section class="hero"><p class="eyebrow">'+esc(item.className)+' · '+esc(item.status)+'</p><h1>'+esc(item.title)+'</h1><p>'+new Date(item.at).toLocaleString('zh-CN')+' · 课堂过程与老师人工记录，不是心理测评或课程回放。</p><div class="facts"><div class="fact"><b>'+expected+'</b><span>应到人数</span></div><div class="fact"><b>'+actual+'</b><span>实到人数</span></div><div class="fact"><b>'+rate+'</b><span>到课率</span></div><div class="fact"><b>'+completed+' / 6</b><span>已到达环节</span></div></div></section><section class="panel ai-panel"><div class="analysis-head"><div><p class="eyebrow">AI 辅助多维观察</p><h2>基于允许使用的课堂数据整理</h2></div><span>前端分析框架</span></div><div class="analysis-grid">'+analysisHtml+'</div><p class="analysis-rule">AI 只使用课堂行为、课程选择和学生主动授权内容；私密聊天与每日记录默认不进入老师分析。每项结论必须保留来源，数据不足时不作判断，也不生成心理健康分数、疾病标签或诊断。</p></section><div class="grid"><section class="panel"><p class="eyebrow">课堂流程</p><h2>本场课堂到达情况</h2><div class="stage-list">'+bars+'</div><p class="boundary">这里仅记录老师实际打开过哪些环节。学生个人对话、训练输入和私密记录不会在这里回放。</p></section><section class="panel"><p class="eyebrow">主动支持</p><h2>学生明确交给老师的请求</h2><div class="support-stat"><strong>'+supports+'</strong><span>条来源于本课堂的主动提交</span></div><p>只有学生主动选择“想让老师知道”或使用求助入口的内容才会计入；普通聊天和每日记录不计入。</p></section></div><section class="panel manual"><p class="eyebrow">老师复核与补充</p><h2>确认、修正或补充 AI 观察</h2><label>课堂参与与组织<textarea id="obs-participation" placeholder="例如：课堂节奏、设备情况、班级参与方式……">'+esc(obs.participation||'')+'</textarea></label><label>学生主动表达情况<textarea id="obs-expression" placeholder="只记录学生主动授权或课堂公开表达，不复制私密对话全文。">'+esc(obs.expression||'')+'</textarea></label><label>需要继续跟进的事项<textarea id="obs-support" placeholder="记录后续人工行动，不填写自动风险等级或诊断。">'+esc(obs.support||'')+'</textarea></label><button class="save" id="save-note">保存人工记录</button><span class="save-state" id="save-state"></span><p class="boundary">老师的复核结果与 AI 观察并列保存。AI 不会根据一次课堂自动生成心理评分、疾病标签或风险等级。</p></section>';
document.getElementById('save-note').onclick=function(){var next={participation:document.getElementById('obs-participation').value.trim(),expression:document.getElementById('obs-expression').value.trim(),support:document.getElementById('obs-support').value.trim()},updated=rows.map(function(x){if(x.sessionId!==item.sessionId)return x;return Object.assign({},x,{observations:next,observationUpdatedAt:Date.now()})});localStorage.setItem(key,JSON.stringify(updated));document.getElementById('save-state').textContent='已保存'};}
render();
})();
</script><script src="assets/teacher-ui.js?v=unified-2"></script></body></html>
