ol-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:11px}.control-row button,.end-row button,.waiting-actions button{min-height:40px;border:1px solid #d7e5e1;border-radius:9px;background:#fff;color:#34595f;cursor:pointer}.control-row .primary,.waiting-actions .primary{border-color:var(--teal);background:var(--teal);color:#fff;font-weight:700}.end-row{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}.end-row .end,.waiting-actions .end{color:var(--danger)}.presence-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0}.presence-strip span{padding:9px;border-radius:9px;background:#f5f9f8;text-align:center}.presence-strip b{display:block;font-size:17px}.presence-strip small{color:var(--muted);font-size:11px}.absence{margin:8px 0 12px;padding:10px 12px;border-radius:9px;background:#fff7ea;color:#7c5a24}.absence b{margin-right:6px}.roster-tools{display:flex;gap:6px;margin-bottom:9px;overflow-x:auto}.roster-tools button{flex:none;padding:6px 9px;border:1px solid #dce8e5;border-radius:999px;background:#fff;color:#60777c;cursor:pointer;font-size:11px}.roster-tools button.on{border-color:#7ac2af;background:#edf9f5;color:#116d60}.student-grid{display:grid;gap:7px}.student-row{display:grid;grid-template-columns:minmax(90px,1fr) 66px minmax(95px,1.1fr) 76px;gap:7px;align-items:center;min-height:45px;padding:8px 10px;border-radius:9px;background:#f8fbfa}.student-row strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.connection,.task-state{font-size:11px}.connection:before{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#2ca97f;content:""}.connection.reconnect:before{background:#e39a30}.connection.offline:before{background:#abb8b9}.student-stage{color:#355a60;font-size:11px}.task-state{color:#667c81}.task-state.done{color:#11715f;font-weight:650}.demo-boundary{margin:12px 0 0;color:#829397;font-size:11px}.waiting-card{display:grid;gap:4px;margin:16px 0;padding:14px;border-radius:11px;background:linear-gradient(135deg,#edf9f5,#f1f7fb)}.waiting-card span{color:var(--muted)}.waiting-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.empty-session{grid-column:1/-1;align-self:center;justify-self:center;text-align:center}.empty-session a{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:9px;background:var(--teal);color:#fff;text-decoration:none}@media(max-width:1080px){.shell{grid-template-columns:minmax(480px,1fr) minmax(360px,420px)}}@media(max-width:880px){html,body{height:auto;overflow:auto}.top{position:sticky;z-index:20;top:0;padding:0 12px}.brand span{display:none}.shell,.shell.preview-collapsed{display:block;height:auto;padding:9px}.preview-panel{height:56vh;min-height:430px}.shell.preview-collapsed .preview-panel{display:none}.control-panel{margin-top:9px;overflow:visible}.student-grid,.shell.preview-collapsed .student-grid{grid-template-columns:1fr}.preview-toggle{padding:0 9px}.workbench{display:none}}@media(max-width:540px){.top{height:56px}.brand{font-size:18px}.live{display:none}.shell{padding:7px}.preview-panel{height:53vh;min-height:360px}.control-inner{padding:15px}.flow{grid-template-columns:repeat(2,1fr)}.control-row{grid-template-columns:1fr 1fr}.control-row .primary{grid-column:1/-1}.student-row{grid-template-columns:minmax(82px,1fr) 58px minmax(88px,1fr)}.student-row .task-state{grid-column:1/-1;padding-left:0}.presence-strip{grid-template-columns:repeat(2,1fr)}}
</style>

<body>
<header class="top"><div class="brand">云听 <span>课堂管理</span></div><div class="top-actions"><button class="preview-toggle" id="previewToggle" type="button">收起课堂预览</button><a class="workbench" href="teacher.html?view=dashboard">工作台</a><span class="live" id="live">● 课堂准备中</span></div></header>
<main class="shell" id="shell"><section class="preview-panel"><div class="preview-head"><div class="preview-title"><b>当前课堂流程</b><span>课堂管理</span><small id="previewModeHint">与学生同步</small></div></div><div class="stage"><iframe class="student-view" id="studentView" title="课堂流程预览"></iframe></div></section><aside class="control-panel"><div class="control-inner" id="side"></div></aside></main>
<script src="assets/demo-data.js?v=demo-1"></script>
<script src="assets/classroom-state.js?v=platform-7"></script>
<script>
window.YTSeedDemo&&window.YTSeedDemo.ensure();
(function(){'use strict';
var labels={enter:'进入课堂',story:'故事导入',talk:'和小悦悦聊聊',energy:'心理能量补给',playground:'成长训练场',closing:'收束与尾声'};
var duration={enter:2,story:5,talk:16,energy:7,playground:8,closing:7};
var detail={enter:'主题、课堂约定与进入状态',story:'从故事进入主题并完成个人表达',talk:'主题相关的学生私密表达',energy:'聆听本节课配置的心理能量音乐',playground:'自主选择一个能力训练小游戏',closing:'情绪收束与四种表达出口'};
var order=['enter','story','talk','energy','playground','closing'],side=document.getElementById('side'),frame=document.getElementById('studentView'),shell=document.getElementById('shell'),querySession=new URLSearchParams(location.search).get('session'),rosterFilter='all';
function state(){return YTClassroomDemo.read()}
function records(){try{var rows=JSON.parse(localStorage.getItem('yunting-class-records-v1'))||[];return Array.isArray(rows)?rows:[]}catch(e){return[]}}
function saveRecord(s,status){var rows=records().filter(function(x){return x.sessionId!==s.sessionId}),progress={};order.forEach(function(k){progress[k]=(s.reachedStages||[]).indexOf(k)>=0?100:0});rows.unshift({sessionId:s.sessionId,title:s.courseTitle,classId:s.classId,className:s.className,progressMode:s.progressMode||'teacher',at:s.startedAt||s.createdAt,status:status,endedAt:s.endedAt||null,expectedStudents:s.expectedStudents,actualStudents:s.actualStudents==null?null:s.actualStudents,presenceSource:'demo',reachedStages:s.reachedStages||[],stageProgress:progress,updatedAt:Date.now()});localStorage.setItem('yunting-class-records-v1',JSON.stringify(rows))}
function elapsed(from,s){if(!from)return 0;var end=s.paused&&s.pausedAt?s.pausedAt:Date.now(),paused=s.totalPausedMs||0;return Math.max(0,end-from-paused)}
function clock(ms){var total=Math.floor(ms/1000),m=Math.floor(total/60),sec=total%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function classStudents(s){try{var ids=String(s.classId||'').split(','),rows=JSON.parse(localStorage.getItem('yunting-class-students-v1'))||[];return rows.filter(function(x){return ids.indexOf(x.classId)>=0})}catch(e){return[]}}
function rosterData(s,waiting){var rows=classStudents(s),shared=Math.max(0,order.indexOf(s.stage)),selfBase=Math.max(0,Math.floor(elapsed(s.startedAt,s)/150000));return rows.map(function(x,i){var connection=i%11===10?'reconnect':(i%7===6?'offline':'online'),stage=null,done=false;if(!waiting&&connection!=='offline'){var idx=s.progressMode==='student'?Math.min(order.length-1,selfBase+(i%3)):shared;stage=order[idx];done=s.progressMode==='student'?(idx===order.length-1&&i%2===0):(i%4===0)}return{student:x,connection:connection,stage:stage,done:done}})}
function rosterHtml(s,waiting){var data=rosterData(s,waiting),online=data.filter(function(x){return x.connection==='online'}).length,reconnect=data.filter(function(x){return x.connection==='reconnect'}).length,missing=data.filter(function(x){return x.connection==='offline'}),done=data.filter(function(x){return x.done}).length,visible=data.filter(function(x){return rosterFilter==='all'||(rosterFilter==='missing'&&x.connection==='offline')||(rosterFilter==='active'&&x.connection!=='offline'&&!x.done)||(rosterFilter==='done'&&x.done)});return '<section class="section"><div class="section-head"><h2>学生课堂进度</h2><small>'+data.length+' 人名册</small></div><div class="presence-strip"><span><b>'+online+'</b><small>在线</small></span><span><b>'+reconnect+'</b><small>重连中</small></span><span><b>'+missing.length+'</b><small>未进入</small></span><span><b>'+done+'</b><small>已完成当前任务</small></span></div>'+(missing.length?'<div class="absence"><b>未进入：</b>'+missing.map(function(x){return esc(x.student.name)}).join('、')+'</div>':'<div class="absence"><b>全部学生已进入课堂</b></div>')+'<div class="roster-tools"><button data-filter="all" class="'+(rosterFilter==='all'?'on':'')+'">全部</button><button data-filter="missing" class="'+(rosterFilter==='missing'?'on':'')+'">未进入</button><button data-filter="active" class="'+(rosterFilter==='active'?'on':'')+'">进行中</button><button data-filter="done" class="'+(rosterFilter==='done'?'on':'')+'">已完成</button></div><div class="student-grid">'+visible.map(function(x){var status=x.connection==='online'?'在线':(x.connection==='reconnect'?'重连中':'未进入'),stage=x.stage?labels[x.stage]:'等待进入课堂';return '<div class="student-row"><strong>'+esc(x.student.name)+'</strong><span class="connection '+x.connection+'">'+status+'</span><span class="student-stage">'+stage+'</span><span class="task-state '+(x.done?'done':'')+'">'+(x.connection==='offline'?'—':(x.done?'本环节已完成':'进行中'))+'</span></div>'}).join('')+'</div><p class="demo-boundary">以上连接与进度为前端演示状态；正式版需接入账号、心跳与实时课堂服务。</p></section>'}
function write(s){YTClassroomDemo.write(s)}
function setStage(s,next){var now=Date.now();if(s.progressMode==='student'){s.teacherPreviewStage=next;s.teacherPreviewStageStartedAt=now}else{s.stage=next;s.teacherPreviewStage=next;s.stageStartedAt=now;s.stageExtraMin=0;s.reachedStages=Array.from(new Set((s.reachedStages||[]).concat(next)))}s.paused=false;s.pausedAt=null;write(s);if(s.progressMode!=='student')saveRecord(s,'进行中')}
function currentTeacherStage(s){return s.progressMode==='student'?(s.teacherPreviewStage||s.stage||'enter'):(s.stage||'enter')}
function flowHtml(s,stage){return '<div class="flow">'+order.map(function(k,i){return '<button type="button" data-stage="'+k+'" class="'+(k===stage?'on':'')+'"><span>'+(i+1)+' · '+duration[k]+'分钟</span><b>'+labels[k]+'</b></button>'}).join('')+'</div>'}
function bindRosterFilters(){side.querySelectorAll('[data-filter]').forEach(function(b){b.onclick=function(){rosterFilter=b.dataset.filter;render()}})}
function render(){var s=state();if(!s.sessionId||(querySession&&querySession!==s.sessionId)){shell.innerHTML='<section class="empty-session"><h1>没有找到这场课堂</h1><p>课堂场次可能已经失效，或当前页面连接的不是同一场课堂。</p><a href="teacher.html?view=records">返回课堂记录</a></section>';return}if(!s.active){location.href='teacher.html?view=records';return}
var target='course.html?id='+encodeURIComponent(s.courseId)+'&mode=classroom&preview=teacher&session='+encodeURIComponent(s.sessionId);if(frame.getAttribute('data-src')!==target){frame.src=target;frame.setAttribute('data-src',target)}
var autonomous=s.progressMode==='student',live=document.getElementById('live'),hint=document.getElementById('previewModeHint');hint.textContent=autonomous?'管理视图独立切换，不影响学生':'老师推进后，学生同步进入';live.className='live '+(s.status==='waiting'?'waiting':(s.paused?'paused':''));live.textContent=s.status==='waiting'?'● 等待正式开始':(s.paused?'● 课堂已暂停':'● 课堂进行中');
if(s.status==='waiting'){side.innerHTML='<p class="eyebrow">'+esc(s.className)+' · '+esc(s.courseTitle)+'</p><div class="course-head"><div><h1>等待学生进入</h1><p>先核对未进入名单，准备好后正式开课。</p></div><span class="mode-badge">'+(autonomous?'学生自主探索':'老师统一控制')+'</span></div><div class="waiting-card"><b>课程 45 分钟 · 应到 '+(s.expectedStudents||classStudents(s).length)+' 人</b><span>'+(autonomous?'学生可独立推进；课堂管理视图也可自由操作。':'老师在课堂管理视图操作并统一推进，学生会自然同步进入下一环节。')+'</span></div>'+rosterHtml(s,true)+'<div class="waiting-actions"><button class="primary" id="start">正式开始课堂</button><button class="end" id="cancel">取消本次课堂</button></div>';bindRosterFilters();side.querySelector('#start').onclick=function(){var now=Date.now();s.status='live';s.startedAt=now;s.stage='enter';s.stageStartedAt=now;s.teacherPreviewStage='enter';s.teacherPreviewStageStartedAt=now;s.studentStage='enter';s.studentStageStartedAt=now;s.reachedStages=['enter'];s.studentProgress={};s.studentCourseCompleted=false;write(s);saveRecord(s,'进行中')};side.querySelector('#cancel').onclick=function(){if(!confirm('确认取消这场尚未开始的课堂？'))return;s.active=false;s.status='cancelled';s.endedAt=Date.now();write(s);saveRecord(s,'已取消');location.href='teacher.html?view=records'};return}
var stage=currentTeacherStage(s),extra=s.stageExtraMin||0,stageTarget=duration[stage]+extra,nextIndex=order.indexOf(stage)+1;side.innerHTML='<p class="eyebrow">'+esc(s.className)+' · '+esc(s.courseTitle)+'</p><div class="course-head"><div><h1>'+labels[stage]+'</h1><p>'+detail[stage]+'</p></div><span class="mode-badge">'+(autonomous?'学生自主探索':'老师统一控制')+'</span></div><div class="mode-note">'+(autonomous?'课堂管理视图可自由切换环节，不会改变任何学生的个人进度；暂停和结束仍作用于全班。':'当前课堂由老师统一控制；点击“进入下一环节”后，所有已进入的学生会同步进入。')+'</div><div class="timers"><div class="timer"><span>整节课堂</span><b id="classClock">'+clock(elapsed(s.startedAt,s))+' / 45:00</b></div><div class="timer"><span>当前管理环节</span><b id="stageClock">'+clock(elapsed(autonomous?(s.teacherPreviewStageStartedAt||s.stageStartedAt):s.stageStartedAt,s))+' / '+String(stageTarget).padStart(2,'0')+':00</b></div></div><section class="section"><div class="section-head"><h2>课堂环节</h2><small>'+(autonomous?'只切换课堂管理视图':'切换后同步全班')+'</small></div>'+flowHtml(s,stage)+'<div class="control-row"><button class="primary" id="next">'+(nextIndex<order.length?(autonomous?'预览下一环节':'进入下一环节 · 同步学生'):'已到最后环节')+'</button><button id="pause">'+(s.paused?'继续课堂':'暂停课堂')+'</button><button id="extend">+ 3 分钟</button></div><div class="end-row"><button class="end" id="end">结束课堂</button></div></section>'+rosterHtml(s,false);bindRosterFilters();side.querySelectorAll('[data-stage]').forEach(function(b){b.onclick=function(){setStage(s,b.dataset.stage)}});side.querySelector('#next').onclick=function(){if(nextIndex<order.length)setStage(s,order[nextIndex])};side.querySelector('#pause').onclick=function(){if(!s.paused){s.paused=true;s.pausedAt=Date.now()}else{s.totalPausedMs=(s.totalPausedMs||0)+(Date.now()-(s.pausedAt||Date.now()));s.paused=false;s.pausedAt=null}write(s)};side.querySelector('#extend').onclick=function(){s.stageExtraMin=(s.stageExtraMin||0)+3;write(s)};side.querySelector('#end').onclick=function(){if(!confirm('确认结束本次课堂？系统会保存已到达的环节。'))return;s.active=false;s.status='ended';s.endedAt=Date.now();write(s);saveRecord(s,'已结束');location.href='teacher.html?view=records'};tick()}
function tick(){var s=state();if(!s.active||s.status!=='live')return;var a=document.getElementById('classClock'),b=document.getElementById('stageClock'),stage=currentTeacherStage(s);if(a)a.textContent=clock(elapsed(s.startedAt,s))+' / 45:00';if(b)b.textContent=clock(elapsed(s.progressMode==='student'?(s.teacherPreviewStageStartedAt||s.stageStartedAt):s.stageStartedAt,s))+' / '+String(duration[stage]+(s.stageExtraMin||0)).padStart(2,'0')+':00'}
frame.addEventListener('load',function(){try{var d=frame.contentDocument,st=d.createElement('style');st.textContent='html,body{height:100%!important;overflow:hidden!important}body>.auth-session-control{display:none!important}#app,.stage-host{height:100%!important;min-height:0!important;overflow:hidden!important}.stage{height:100%!important;min-height:0!important;overflow:hidden!important}.scene-enter,.scene-story,.scene-talk,.scene-energy,.scene-playground,.scene-practice,.scene-closing{height:100%!important;min-height:0!important;overflow-y:auto!important;overscroll-behavior:contain}';d.head.appendChild(st)}catch(e){}});
var collapsed=sessionStorage.getItem('yunting-teacher-preview-collapsed')==='1',toggle=document.getElementById('previewToggle');function applyCollapse(){shell.classList.toggle('preview-collapsed',collapsed);toggle.textContent=collapsed?'展开课堂预览':'收起课堂预览';toggle.setAttribute('aria-expanded',collapsed?'false':'true')}toggle.onclick=function(){collapsed=!collapsed;sessionStorage.setItem('yunting-teacher-preview-collapsed',collapsed?'1':'0');applyCollapse()};applyCollapse();
var last='';YTClassroomDemo.subscribe(function(){var s=state(),sig=[s.sessionId,s.active,s.status,s.stage,s.teacherPreviewStage,s.studentStage,s.paused,s.updatedAt].join('|');if(!s.active){location.href='teacher.html?view=records';return}if(sig!==last){last=sig;render()}});setInterval(tick,1000);render();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=7').catch(function(){})}
})();
</script>
</body></html>
