<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云听｜课堂进行中</title>
<style>
:root{--bg1:#f0fdf4;--bg2:#e0f2fe;--bg3:#faf5ff;--fallback:#f4f9f6;--ink:#23424c;--muted:#708992;--line:#dbece8;--teal:#168677;--mint:#e9faf2;--sky:#edf8ff;--pink:#fff2f7}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.55 "PingFang SC","Microsoft YaHei",sans-serif;background-color:var(--fallback);background-image:radial-gradient(circle at 50% -20%,var(--bg1),var(--bg2) 52%,var(--bg3));background-attachment:fixed}button,a{font:inherit}.top{height:58px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(219,236,232,.8);background:rgba(255,255,255,.74)}.brand{font-weight:900}.brand span{margin-left:7px;color:var(--teal);font-size:12px}.workbench{display:inline-block;margin-right:9px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--teal);background:#fff;text-decoration:none;font-size:12px;font-weight:800}.live{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9faf2;color:#267565;font-size:12px;font-weight:800}.live.waiting{background:#fff4df;color:#8f641f}.live.paused{background:#edf8ff;color:#3c7084}.shell{height:calc(100dvh - 58px);display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:17px;padding:17px}.stage{position:relative;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 20px 42px -38px rgba(17,88,80,.46)}.stage::after{content:'教师演示视图 · 可操作';position:absolute;top:13px;right:13px;z-index:5;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--teal);font-size:11px;font-weight:900;box-shadow:0 6px 18px rgba(31,91,85,.12);pointer-events:none}.student-view{width:100%;height:100%;min-height:560px;border:0;background:#f4f9f6}.side{overflow:auto;padding:18px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.9)}.eyebrow{margin:0 0 7px;color:var(--teal);font-size:11px;font-weight:900;letter-spacing:.13em}.side h1{margin:0;font-size:22px;line-height:1.3}.side p{margin:7px 0;color:var(--muted)}.waiting-card{padding:16px;border-radius:15px;background:var(--sky);margin:16px 0}.waiting-card b,.waiting-card span{display:block}.waiting-card span{margin-top:4px;color:var(--muted);font-size:12px}.timers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.timer{padding:11px 12px;border-radius:12px;background:var(--sky)}.timer span,.timer b{display:block}.timer span{color:var(--muted);font-size:11px}.timer b{margin-top:2px;color:var(--teal);font-size:15px}.flow{display:grid;gap:7px;margin:16px 0}.flow button{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border:1px solid #cce7df;border-radius:10px;text-align:left;background:#fff;color:var(--muted);cursor:pointer}.flow button small{font-size:11px;opacity:.82}.flow button.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:850}.flow button.reached:not(.on){background:#f2faf7;color:#44736a}.flow button:disabled{cursor:default;opacity:.86}.progress-box{padding:12px;border-radius:12px;background:#f5faf9}.progress-row{display:flex;justify-content:space-between;gap:12px}.progress-row b{color:var(--teal)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.controls button{padding:9px 11px;border:1px solid #bcddd4;border-radius:10px;background:#fff;color:var(--teal);cursor:pointer}.controls .primary{border-color:var(--teal);background:var(--teal);color:#fff}.controls .end{border-color:#edbdd0;color:#a6496f}.note{padding:11px;border-radius:11px;background:var(--sky);color:var(--muted);font-size:12px}.student-roster{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.roster-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.roster-head h2{margin:0;font-size:15px}.roster-head span{color:var(--teal);font-size:11px;font-weight:900}.roster-list{display:grid;gap:7px;max-height:330px;overflow:auto;margin-top:10px;padding-right:3px}.student-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px;border:1px solid #e3efec;border-radius:11px;background:#fbfefd}.student-avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sky);color:var(--teal);font-size:11px;font-weight:900}.student-copy{min-width:0}.student-copy b,.student-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.student-copy b{font-size:12px}.student-copy span{color:var(--muted);font-size:10px}.student-state{padding:4px 6px;border-radius:999px;background:#e9faf2;color:#267565;font-size:9px;font-weight:900}.student-state.warn{background:#fff4df;color:#8f641f}.student-state.offline{background:#f1f4f4;color:#71858a}.roster-demo{margin-top:9px!important;font-size:10px!important}.demo-presence{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.demo-presence h2{margin:0;font-size:15px}.demo-presence-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.presence-stat{padding:10px;border-radius:11px;background:#f5faf9;text-align:center}.presence-stat b,.presence-stat span{display:block}.presence-stat b{font-size:18px}.presence-stat span{color:var(--muted);font-size:10px}.empty-session{max-width:620px;margin:80px auto;padding:30px;border:1px solid var(--line);border-radius:22px;background:#fff;text-align:center}.empty-session a{color:var(--teal)}@media(max-width:900px){.shell{grid-template-columns:1fr;height:auto}.student-view{height:62dvh;min-height:470px}.flow{grid-template-columns:repeat(3,1fr)}.roster-list{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}}@media(max-width:560px){.roster-list{grid-template-columns:1fr}.top{padding:0 13px}.brand span{display:none}.shell{padding:10px}.timers{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.demo-presence-grid{grid-template-columns:1fr 1fr 1fr}}
</style>
<link rel="stylesheet" href="assets/teacher-ui.css?v=unified-2">
</head>
<body>
<header class="top"><div class="brand">云听 <span>老师课堂视图 · 与学生同一课程流程</span></div><div><a class="workbench" href="teacher.html?view=dashboard">工作台</a><span class="live" id="live">● 课堂准备中</span></div></header>
<main class="shell" id="shell"><section class="stage"><iframe class="student-view" id="studentView" title="只读学生课堂视图"></iframe></section><aside class="side" id="side"></aside></main>
<script src="assets/demo-data.js?v=demo-1"></script>
<script src="assets/classroom-state.js?v=platform-7"></script>
<script>
window.YTSeedDemo&&window.YTSeedDemo.ensure();
(function(){
'use strict';
var labels={enter:'进入课堂',story:'故事导入',talk:'和小悦悦聊聊',energy:'心理能量补给',playground:'成长训练场',closing:'收束与尾声'};
var duration={enter:2,story:5,talk:16,energy:7,playground:8,closing:7};
var detail={enter:'主题、课堂约定与进入状态',story:'从故事进入主题并完成个人表达',talk:'主题相关的学生私密表达',energy:'聆听本节课配置的心理能量音乐',playground:'自主选择一个能力训练小游戏',closing:'情绪收束与四种表达出口'};
var order=['enter','story','talk','energy','playground','closing'],side=document.getElementById('side'),frame=document.getElementById('studentView'),querySession=new URLSearchParams(location.search).get('session');
function state(){return YTClassroomDemo.read()}
function records(){try{var rows=JSON.parse(localStorage.getItem('yunting-class-records-v1'))||[];return Array.isArray(rows)?rows:[]}catch(e){return[]}}
function saveRecord(s,status){var rows=records().filter(function(x){return x.sessionId!==s.sessionId}),progress={};order.forEach(function(k){progress[k]=(s.reachedStages||[]).indexOf(k)>=0?100:0});rows.unshift({sessionId:s.sessionId,title:s.courseTitle,className:s.className,progressMode:s.progressMode||'teacher',at:s.startedAt||s.createdAt,status:status,endedAt:s.endedAt||null,expectedStudents:s.expectedStudents,actualStudents:s.actualStudents==null?null:s.actualStudents,reachedStages:s.reachedStages||[],stageProgress:progress,observations:{participation:'',expression:'',support:''},teacherNote:'',demo:true});localStorage.setItem('yunting-class-records-v1',JSON.stringify(rows.slice(0,20)))}
function elapsed(from,s){if(!from)return 0;var end=s.paused&&s.pausedAt?s.pausedAt:Date.now(),paused=s.totalPausedMs||0;return Math.max(0,end-from-paused)}
function clock(ms){var total=Math.floor(ms/1000),m=Math.floor(total/60),sec=total%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function currentCompleted(s,stage){stage=stage||s.stage;return !!(s.studentProgress&&s.studentProgress[stage]&&s.studentProgress[stage].status==='completed')}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function classStudents(s){try{var ids=String(s.classId||'').split(','),rows=JSON.parse(localStorage.getItem('yunting-class-students-v1'))||[];return rows.filter(function(x){return ids.indexOf(x.classId)>=0})}catch(e){return[]}}
function rosterHtml(s,waiting){var rows=classStudents(s),base=order.indexOf(s.studentStage||s.stage),online=0,reconnect=0,pending=0,items=rows.map(function(x,i){var kind=i%11===10?'warn':(i%7===6?'offline':'online'),status=kind==='online'?'在线':(kind==='warn'?'重新连接':'未进入'),stage='等待进入课堂';if(kind==='online')online++;else if(kind==='warn')reconnect++;else pending++;if(!waiting&&kind!=='offline'){var idx=s.progressMode==='student'?Math.max(0,Math.min(order.length-1,base+(i%3)-1)):order.indexOf(s.stage);stage=labels[order[idx]]+(i%3===0?' · 已完成':' · 进行中')}else if(waiting&&kind==='online'){stage='已进入等待页'}return '<div class="student-row"><i class="student-avatar">'+esc((x.name||'学').slice(-1))+'</i><div class="student-copy"><b>'+esc(x.name||'未命名学生')+'</b><span>'+esc(stage)+'</span></div><em class="student-state '+(kind==='online'?'':kind)+'">'+status+'</em></div>'}).join('');return '<section class="student-roster"><div class="roster-head"><h2>全班学生状态</h2><span>'+online+' 在线 · '+reconnect+' 重连 · '+pending+' 未进入</span></div><div class="roster-list">'+(items||'<p class="note">当前班级还没有学生名单。</p>')+'</div><p class="roster-demo">当前为基于班级名单生成的前端演示状态；真实在线、掉线和每位学生所在环节需由实时课堂服务返回。</p></section>'}
function changeStage(s,next){if(next===s.stage)return;if(!currentCompleted(s)&&s.status==='live'&&!confirm('当前演示学生尚未完成“'+labels[s.stage]+'”。确认仍要切换到“'+labels[next]+'”吗？已有输入会保留。'))return;s.stage=next;s.stageStartedAt=Date.now();s.stageExtraMin=0;s.reachedStages=Array.from(new Set((s.reachedStages||[]).concat(next)));s.paused=false;s.pausedAt=null;YTClassroomDemo.write(s);saveRecord(s,'进行中');render()}
function render(){
 var s=state();
 if(!s.sessionId||(querySession&&querySession!==s.sessionId)){document.getElementById('shell').innerHTML='<section class="empty-session"><h1>没有找到这场课堂</h1><p>课堂场次可能已经失效，或当前页面连接的不是同一场课堂。</p><a href="teacher.html?view=records">返回课堂记录</a></section>';return}
 if(!s.active){location.href='teacher.html?view=records';return}
 var target='course.html?id='+encodeURIComponent(s.courseId)+'&mode=classroom&preview=teacher&session='+encodeURIComponent(s.sessionId);if(frame.getAttribute('data-src')!==target){frame.src=target;frame.setAttribute('data-src',target)}
 var live=document.getElementById('live');live.className='live '+(s.status==='waiting'?'waiting':(s.paused?'paused':''));live.textContent=s.status==='waiting'?'● 等待正式开始':(s.paused?'● 课堂已暂停':'● 课堂进行中');
 if(s.status==='waiting'){
  side.innerHTML='<p class="eyebrow">'+s.className+' · '+s.courseTitle+'</p><h1>等待学生进入</h1><p>课堂场次已经创建，学生端会停留在等待页。确认设备和课堂环境后再正式开始。</p><div class="waiting-card"><b>推进方式：'+(s.progressMode==='student'?'学生自主探索':'老师统一控制')+'</b><span>课程 45 分钟 · 应到 '+(s.expectedStudents||0)+' 人 · 当前为同浏览器流程演示</span></div>'+rosterHtml(s,true)+'<div class="controls"><button class="primary" id="start">正式开始课堂</button><button class="end" id="cancel">取消本次课堂</button></div>';
  side.querySelector('#start').onclick=function(){var now=Date.now();s.status='live';s.startedAt=now;s.stageStartedAt=now;s.studentStage='enter';s.studentStageStartedAt=now;s.reachedStages=['enter'];s.studentProgress={};s.studentCourseCompleted=false;YTClassroomDemo.write(s);saveRecord(s,'进行中');render()};
  side.querySelector('#cancel').onclick=function(){if(!confirm('确认取消这场尚未开始的课堂？'))return;s.active=false;s.status='cancelled';s.endedAt=Date.now();YTClassroomDemo.write(s);saveRecord(s,'已取消');location.href='teacher.html?view=records'};
  return;
 }
 var autonomous=s.progressMode==='student',displayStage=autonomous?(s.studentStage||s.stage):s.stage,extra=s.stageExtraMin||0,stageTarget=duration[displayStage]+extra,done=currentCompleted(s,displayStage);
 side.innerHTML='<p class="eyebrow">'+s.className+' · '+s.courseTitle+'</p><h1>'+labels[displayStage]+'</h1><p>'+(autonomous?'当前为学生自主探索模式 · ':'当前为老师统一控制模式 · ')+detail[displayStage]+'</p><div class="timers"><div class="timer"><span>整节课堂</span><b>'+clock(elapsed(s.startedAt,s))+' / 45:00</b></div><div class="timer"><span>'+(autonomous?'演示学生当前环节':'老师当前环节')+'</span><b>'+clock(elapsed(autonomous?(s.studentStageStartedAt||s.stageStartedAt):s.stageStartedAt,s))+' / '+String(stageTarget).padStart(2,'0')+':00</b></div></div><div class="flow">'+order.map(function(x){var cls=(x===displayStage?'on ':'')+((s.reachedStages||[]).indexOf(x)>=0?'reached':'');return '<button class="'+cls+'" data-stage="'+x+'" '+(autonomous?'disabled':'')+'><span>'+labels[x]+'</span><small>'+duration[x]+' 分钟</small></button>'}).join('')+'</div><div class="progress-box"><div class="progress-row"><span>'+(autonomous?'演示学生探索进度':'当前环节个人任务')+'</span><b>'+(s.studentCourseCompleted?'整节课已完成':(done?'当前环节已完成':'正在进行'))+'</b></div><p>'+(autonomous?'学生可以按自己的节奏进入下一环节；老师仍可暂停或结束课堂。':'学生完成当前环节后等待，由老师统一推进。')+'</p></div><div class="controls"><button id="pause">'+(s.paused?'继续课堂':'暂停课堂')+'</button><button id="extend1">延长 1 分钟</button><button id="extend3">延长 3 分钟</button>'+(autonomous?'':'<button class="primary" id="next">下一环节</button>')+'<button class="end" id="end">结束课堂</button></div>'+rosterHtml(s,false)+'';
 side.querySelectorAll('[data-stage]:not([disabled])').forEach(function(b){b.onclick=function(){changeStage(s,b.dataset.stage)}});
 side.querySelector('#pause').onclick=function(){if(!s.paused){s.paused=true;s.pausedAt=Date.now()}else{s.totalPausedMs=(s.totalPausedMs||0)+(Date.now()-(s.pausedAt||Date.now()));s.paused=false;s.pausedAt=null}YTClassroomDemo.write(s);render()};
 side.querySelector('#extend1').onclick=function(){s.stageExtraMin=(s.stageExtraMin||0)+1;YTClassroomDemo.write(s);render()};
 side.querySelector('#extend3').onclick=function(){s.stageExtraMin=(s.stageExtraMin||0)+3;YTClassroomDemo.write(s);render()};
 var nextButton=side.querySelector('#next');if(nextButton)nextButton.onclick=function(){var i=order.indexOf(s.stage);if(i<order.length-1)changeStage(s,order[i+1]);else alert('已经是最后一个环节，请确认收束后结束课堂。')};
 side.querySelector('#end').onclick=function(){if(!confirm('确认结束本次课堂？系统会保存已到达的环节，并在 10 分钟内保留恢复入口。'))return;s.active=false;s.status='ended';s.endedAt=Date.now();YTClassroomDemo.write(s);saveRecord(s,'已结束');location.href='teacher.html?view=records'};
}
var last='';YTClassroomDemo.subscribe(function(){var s=state(),sig=[s.sessionId,s.active,s.status,s.stage,s.paused,s.updatedAt].join('|');if(!s.active){location.href='teacher.html?view=records';return}if(sig!==last){last=sig;render()}});setInterval(function(){var s=state();if(s.active&&s.status==='live')render()},1000);render();
})();
</script>
<script src="assets/teacher-ui.js?v=unified-2"></script>
</body>
</html>
