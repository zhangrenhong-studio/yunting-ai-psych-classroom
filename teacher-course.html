<header class="top"><div class="brand">云听 <span>课堂管理</span></div><div class="top-actions"><button class="preview-toggle" id="previewToggle" type="button">隐藏学生画面</button><a class="workbench" href="teacher.html?view=dashboard">工作台</a><span class="live" id="live">● 课堂准备中</span></div></header>

<script>
window.YTSeedDemo&&window.YTSeedDemo.ensure();
(function(){'use strict';

var order=['enter','story','talk','energy','playground','closing'],side=document.getElementById('side'),roster=document.getElementById('roster'),frame=document.getElementById('studentView'),shell=document.getElementById('shell'),querySession=new URLSearchParams(location.search).get('session'),rosterFilter='all';
function state(){return YTClassroomDemo.read()}
function records(){try{var rows=JSON.parse(localStorage.getItem('yunting-class-records-v1'))||[];return Array.isArray(rows)?rows:[]}catch(e){return[]}}

function elapsed(from,s){if(!from)return 0;var end=s.paused&&s.pausedAt?s.pausedAt:Date.now(),paused=s.totalPausedMs||0;return Math.max(0,end-from-paused)}

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function rosterData(s,waiting){var rows=classStudents(s),shared=Math.max(0,order.indexOf(s.stage)),selfBase=Math.max(0,Math.floor(elapsed(s.startedAt,s)/150000));return rows.map(function(x,i){var connection=i%11===10?'reconnect':(i%7===6?'offline':'online'),stage=null,done=false;if(!waiting&&connection!=='offline'){var idx=s.progressMode==='student'?Math.min(order.length-1,selfBase+(i%3)):shared;stage=order[idx];done=s.progressMode==='student'?(idx===order.length-1&&i%2===0):(i%4===0)}return{student:x,connection:connection,stage:stage,done:done}})}
function rosterHtml(s,waiting){var data=rosterData(s,waiting),online=data.filter(function(x){return x.connection==='online'}).length,reconnect=data.filter(function(x){return x.connection==='reconnect'}).length,missing=data.filter(function(x){return x.connection==='offline'}).length,done=data.filter(function(x){return x.done}).length,visible=data.filter(function(x){return rosterFilter==='all'||(rosterFilter==='missing'&&x.connection==='offline')||(rosterFilter==='active'&&x.connection!=='offline'&&!x.done)||(rosterFilter==='done'&&x.done)});return '<section class="section"><div class="student-status-head"><div><h2>全部学生</h2><small>'+data.length+'人</small></div><div class="presence-strip"><span><b>'+online+'</b><small>在线</small></span><span><b>'+missing+'</b><small>未进入</small></span><span><b>'+reconnect+'</b><small>重连</small></span><span><b>'+done+'</b><small>已完成</small></span></div></div><div class="roster-tools"><button data-filter="all" class="'+(rosterFilter==='all'?'on':'')+'">全部</button><button data-filter="missing" class="'+(rosterFilter==='missing'?'on':'')+'">未进入</button><button data-filter="active" class="'+(rosterFilter==='active'?'on':'')+'">进行中</button><button data-filter="done" class="'+(rosterFilter==='done'?'on':'')+'">已完成</button></div><div class="student-grid">'+visible.map(function(x){var status=x.connection==='online'?'在线':(x.connection==='reconnect'?'重连中':'未进入'),stage=x.stage?labels[x.stage]:'等待进入课堂';return '<div class="student-row '+(x.connection==='offline'?'needs-attention':'')+'"><strong>'+esc(x.student.name)+'</strong><span class="connection '+x.connection+'">'+status+'</span><span class="student-stage">'+stage+'</span><span class="task-state '+(x.done?'done':'')+'">'+(x.connection==='offline'?'—':(x.done?'已完成':'进行中'))+'</span></div>'}).join('')+'</div></section>'}

function bindRosterFilters(){roster.querySelectorAll('[data-filter]').forEach(function(b){b.onclick=function(){rosterFilter=b.dataset.filter;render()}})}

var target='course.html?id='+encodeURIComponent(s.courseId)+'&mode=classroom&preview=teacher&session='+encodeURIComponent(s.sessionId);if(frame.getAttribute('data-src')!==target){frame.src=target;frame.setAttribute('data-src',target)}
var autonomous=s.progressMode==='student',live=document.getElementById('live'),hint=document.getElementById('previewModeHint'),controlTitle=document.getElementById('controlTitle');shell.classList.toggle('self-paced',autonomous);controlTitle.textContent=autonomous?'课堂管理':'课堂控制';hint.textContent=autonomous?'学生自主推进':'同步全班';live.className='live '+(s.status==='waiting'?'waiting':(s.paused?'paused':''));live.textContent=s.status==='waiting'?'● 等待正式开始':(s.paused?'● 课堂已暂停':'● 课堂进行中');
if(s.status==='waiting'){side.innerHTML='<p class="eyebrow">'+esc(s.className)+' · '+esc(s.courseTitle)+'</p><div class="course-head"><div><h1>等待开课</h1></div><span class="mode-badge">'+(autonomous?'学生自主探索':'老师统一控制')+'</span></div><div class="waiting-card"><b>45分钟 · 应到 '+(s.expectedStudents||classStudents(s).length)+'人</b></div><div class="waiting-actions"><button class="primary" id="start">正式开始课堂</button><button class="end" id="cancel">取消本次课堂</button></div>';roster.innerHTML=rosterHtml(s,true);bindRosterFilters();side.querySelector('#start').onclick=function(){var now=Date.now();s.status='live';s.startedAt=now;s.stage='enter';s.stageStartedAt=now;s.teacherPreviewStage='enter';s.teacherPreviewStageStartedAt=now;s.studentStage='enter';s.studentStageStartedAt=now;s.reachedStages=['enter'];s.studentProgress={};s.studentCourseCompleted=false;write(s);saveRecord(s,'进行中')};side.querySelector('#cancel').onclick=function(){if(!confirm('确认取消这场尚未开始的课堂？'))return;s.active=false;s.status='cancelled';s.endedAt=Date.now();write(s);saveRecord(s,'已取消');location.href='teacher.html?view=records'};return}
var stage=currentTeacherStage(s),extra=s.stageExtraMin||0,stageTarget=duration[stage]+extra,nextIndex=order.indexOf(stage)+1;side.innerHTML='<p class="eyebrow">'+esc(s.className)+' · '+esc(s.courseTitle)+'</p><div class="course-head"><div><h1>'+(autonomous?'自主探索概览':labels[stage])+'</h1></div><span class="mode-badge">'+(autonomous?'学生自主探索':'老师统一控制')+'</span></div><div class="timers"><div class="timer"><span>课堂时间</span><b id="classClock">'+clock(elapsed(s.startedAt,s))+' / 45:00</b></div><div class="timer"><span>'+(autonomous?'当前预览':'本环节')+'</span><b id="stageClock">'+clock(elapsed(autonomous?(s.teacherPreviewStageStartedAt||s.stageStartedAt):s.stageStartedAt,s))+' / '+String(stageTarget).padStart(2,'0')+':00</b></div></div><section class="section"><div class="section-head"><h2>'+(autonomous?'学生进度分布':'课堂流程')+'</h2></div>'+flowHtml(s,stage)+'<div class="control-row"><button class="primary" id="next">'+(nextIndex<order.length?(autonomous?'查看：'+labels[order[nextIndex]]:'下一步：'+labels[order[nextIndex]]+' · 同步全班'):'已到最后环节')+'</button><button id="pause">'+(s.paused?(autonomous?'继续全班':'继续'):(autonomous?'暂停全班':'暂停'))+'</button>'+(autonomous?'':'<button id="extend">+3分钟</button>')+'</div><div class="end-row"><button class="end" id="end">结束课堂</button></div></section>';roster.innerHTML=rosterHtml(s,false);bindRosterFilters();side.querySelectorAll('[data-stage]').forEach(function(b){b.onclick=function(){setStage(s,b.dataset.stage)}});side.querySelector('#next').onclick=function(){if(nextIndex<order.length)setStage(s,order[nextIndex])};side.querySelector('#pause').onclick=function(){if(!s.paused){s.paused=true;s.pausedAt=Date.now()}else{s.totalPausedMs=(s.totalPausedMs||0)+(Date.now()-(s.pausedAt||Date.now()));s.paused=false;s.pausedAt=null}write(s)};var extendButton=side.querySelector('#extend');if(extendButton)extendButton.onclick=function(){s.stageExtraMin=(s.stageExtraMin||0)+3;write(s)};side.querySelector('#end').onclick=function(){if(!confirm('确认结束本次课堂？系统会保存已到达的环节。'))return;s.active=false;s.status='ended';s.endedAt=Date.now();write(s);saveRecord(s,'已结束');location.href='teacher.html?view=records'};tick()}
