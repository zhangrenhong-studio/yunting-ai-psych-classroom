<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云听｜添加学生</title><style>body{margin:0;min-height:100vh;color:#23424c;font:15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -20%,#f0fdf4,#e0f2fe 52%,#faf5ff)}*{box-sizing:border-box}.shell{width:min(620px,calc(100% - 36px));margin:auto;padding:34px 0}.top{display:flex;justify-content:space-between;margin-bottom:28px}.brand{font-weight:900}.back{color:#168677;text-decoration:none;font-size:13px}.card{padding:30px;border:1px solid #dbece8;border-radius:24px;background:rgba(255,255,255,.9);box-shadow:0 22px 48px -40px rgba(17,88,80,.5)}.eyebrow{margin:0 0 8px;color:#168677;font-size:11px;font-weight:900;letter-spacing:.15em}h1{margin:0 0 24px;font-size:29px;letter-spacing:-.04em}.form{display:grid;gap:16px}label{display:grid;gap:8px;font-weight:750}input{padding:14px;border:1px solid #dbece8;border-radius:13px;background:#fff;font:inherit}input:focus{outline:3px solid #d5f5eb;border-color:#62cbae}.submit{margin-top:8px;padding:14px;border:0;border-radius:13px;background:#168677;color:white;font:800 15px inherit}.error{min-height:18px;margin:0;color:#bb3c57;font-size:13px}.ok{padding:13px;border-radius:13px;background:#eafbf3;color:#247760}.hidden{display:none}</style><link rel="stylesheet" href="assets/teacher-ui.css?v=unified-2"></head><body><main class="shell"><header class="top"><div class="brand">云听</div><a class="back" id="back">← 返回班级</a></header><section class="card"><p class="eyebrow">班级学生</p><h1 id="title">添加学生</h1><form id="form" class="form"><label>学生姓名<input id="name" required maxlength="30" autofocus></label><label>学号 <input id="studentNo" maxlength="30" placeholder="可选"></label><p class="error" id="error"></p><button class="submit">添加学生</button></form><p id="ok" class="ok hidden"></p></section></main><script src="assets/demo-data.js?v=demo-1"></script><script>window.YTSeedDemo&&window.YTSeedDemo.ensure();(function(){var id=new URLSearchParams(location.search).get('class'),CK='yunting-class-groups-v1',SK='yunting-class-students-v1',back=document.getElementById('back');back.href='teacher-class.html?class='+encodeURIComponent(id||'');function read(k){try{var x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:[]}catch(e){return[]}}var c=read(CK).find(function(x){return x.id===id});if(c)document.getElementById('title').textContent='添加学生 · '+(c.grade?c.grade+' · ':'')+c.name;document.getElementById('form').onsubmit=function(e){e.preventDefault();var name=document.getElementById('name').value.trim(),studentNo=document.getElementById('studentNo').value.trim(),error=document.getElementById('error');error.textContent='';if(!c){error.textContent='未找到班级。';return}if(!name){error.textContent='请填写学生姓名。';return}var rows=read(SK);if(studentNo&&rows.some(function(x){return x.classId===id&&x.studentNo===studentNo})){error.textContent='该学号已在本班名单中。';return}rows.push({id:'student-'+Date.now(),classId:id,name:name,studentNo:studentNo,createdAt:new Date().toISOString()});localStorage.setItem(SK,JSON.stringify(rows));document.getElementById('ok').textContent='已添加 '+name;document.getElementById('ok').classList.remove('hidden');setTimeout(function(){location.href=back.href},350)}})();</script><script src="assets/teacher-ui.js?v=unified-2"></script></body></html>
