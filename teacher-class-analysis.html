(function(){var id=new URLSearchParams(location.search).get('class'),CK='yunting-class-groups-v1',SK='yunting-class-students-v1';function read(k){try{var x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:[]}catch(e){return[]}}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function csv(v){return'"'+String(v==null?'':v).replace(/"/g,'""')+'"'}var group=read(CK).find(function(x){return x.id===id}),students=read(SK).filter(function(x){return x.classId===id}),rows=YTPsychInsights.byClass(id);document.getElementById('back').href='teacher-class.html?class='+encodeURIComponent(id||'');if(!group){document.getElementById('app').innerHTML='<div class="card empty">未找到班级。</div>';return}var title=(group.grade?group.grade+' · ':'')+group.name,dist=YTPsychInsights.levelDistribution(rows),dims=YTPsychInsights.dimensionSummary(rows),avg=YTPsychInsights.average(rows.map(function(x){return x.score})),boys=rows.filter(function(x){return x.gender==='男'}),girls=rows.filter(function(x){return x.gender==='女'}),attention=dist.filter(function(x){return x.key==='attention'||x.key==='priority'}).reduce(function(a,x){return a+x.count},0);function donut(d){var n=0,parts=d.map(function(x){var a=n;n+=x.percent;return x.color+' '+a+'% '+n+'%'});return parts.join(',')}function stack(list){var d=YTPsychInsights.levelDistribution(list);return '<div class="stack">'+d.map(function(x){return '<i style="width:'+x.percent+'%;background:'+x.color+'" title="'+x.label+' '+x.percent+'%"></i>'}).join('')+'</div>'}var html='<section class="hero"><p class="eyebrow">班级情况表 · 演示分析</p><h1>'+esc(title)+'</h1><p class="muted">根据学生个人心理洞察汇总班级情况，不展示完整私密对话；结果需由老师结合实际情况复核。</p><div class="actions"><button class="btn primary" id="generate">立即生成班级分析</button><button class="btn" id="export">导出班级情况表</button></div></section><div class="stats"><div class="stat"><span>名册学生</span><b>'+students.length+'</b><small>班级管理名册</sm document.getElementById('export').onclick=function(){var head=['姓名','学号','性别','综合心理状态','综合指数'].concat(YTPsychInsights.dimensions).concat(['有效对话数','更新时间']),data=[head];students.forEach(function(s){var x=YTPsychInsights.byStudent(s.id),level=x&&YTPsychInsights.levelOf(x.score);data.push([s.name,s.studentNo||'',s.gender||x&&x.gender||'',level&&level.label||'未形成',x&&x.score||''].concat(x?x.dimensions:Array(8).fill('')).concat([x&&x.sessions||'',x&&x.updatedAt||'']))});var blob=new Blob(['\uFEFF'+data.map(function(r){return r.map(csv).join(',')}).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=title.replace(/[\\/:*?"<>|]/g,'_')+'班级心理情况表.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},500)};
})();
