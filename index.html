<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云听｜账号登录</title><style>
:root{--ink:#203d43;--muted:#6c8084;--line:#dce9e6;--teal:#168677;--teal-dark:#0f6c61;--mint:#e8f7f2;--sky:#edf7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff}.login-page{min-height:100vh;display:grid;grid-template-columns:minmax(420px,46%) minmax(460px,54%)}.brand-panel{position:relative;display:flex;min-height:100vh;padding:clamp(46px,7vw,100px);overflow:hidden;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#dff7ef 0%,#eef9f7 45%,#e5f3fb 100%)}.brand-panel:before,.brand-panel:after{position:absolute;border-radius:50%;content:"";pointer-events:none}.brand-panel:before{width:440px;height:440px;right:-170px;top:-140px;border:1px solid rgba(22,134,119,.16);box-shadow:0 0 0 54px rgba(255,255,255,.18),0 0 0 108px rgba(255,255,255,.12)}.brand-panel:after{width:180px;height:180px;left:-75px;bottom:-55px;background:rgba(255,255,255,.42)}.brand-mark,.brand-copy,.brand-foot{position:relative;z-index:1}.brand-mark{display:flex;align-items:center;gap:14px}.brand-mark img{width:64px;height:64px;object-fit:contain}.brand-mark b{display:block;color:#145f57;font-size:28px;letter-spacing:.08em}.brand-mark span{display:block;margin-top:2px;color:#55767a;font-size:13px}.brand-copy{max-width:500px}.brand-copy small{display:block;margin-bottom:18px;color:var(--teal);font-size:13px;font-weight:750;letter-spacing:.16em}.brand-copy h1{margin:0;font-size:clamp(38px,3.5vw,52px);line-height:1.16;letter-spacing:-.04em}.brand-copy h1 span{display:block;white-space:nowrap}.brand-copy p{max-width:430px;margin:24px 0 0;color:#547177;font-size:17px;line-height:1.9}.brand-foot{color:#698186;font-size:13px}.login-panel{display:flex;min-height:100vh;padding:54px clamp(40px,8vw,116px);align-items:center;background:#fff}.login-inner{width:min(100%,460px);margin:auto}.continue{display:none;margin-bottom:18px;padding:12px 14px;border-radius:10px;background:#eff8f5;color:#37635e}.continue.show{display:block}.login-panel h2{margin:0;font-size:34px;letter-spacing:-.02em}.login-lead{margin:8px 0 28px;color:var(--muted)}.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;padding:5px;border-radius:12px;background:#f1f6f5}.role-tabs button{min-height:42px;border:0;border-radius:9px;background:transparent;color:#647a7e;cursor:pointer;font-weight:650}.role-tabs button.active{background:#fff;color:var(--teal-dark);box-shadow:0 3px 12px rgba(42,89,79,.09)}form label{display:grid;gap:8px;margin-bottom:17px;color:#405d62;font-weight:600}input{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fbfdfc;color:var(--ink);font:inherit;outline:none}input:focus{border-color:#67b8a7;box-shadow:0 0 0 4px rgba(22,134,119,.1)}.login-button{width:100%;height:50px;margin-top:6px;border:0;border-radius:10px;background:var(--teal);color:#fff;cursor:pointer;font-size:16px;font-weight:700;box-shadow:0 9px 22px rgba(22,134,119,.18)}.login-button:hover{background:var(--teal-dark)}.login-button:disabled{opacity:.65;cursor:wait}.error{min-height:24px;margin:7px 0 0;color:#c84d55}.demo-box{margin-top:22px;padding-top:18px;border-top:1px solid #edf2f1;color:var(--muted);font-size:13px}.demo-box b{color:#3e5d62}.demo-copy{width:100%;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--teal-dark);cursor:pointer}.security-note{margin-top:17px;color:#829397;font-size:12px}@media(max-width:800px){.login-page{display:block}.brand-panel{min-height:270px;padding:30px 24px 34px;justify-content:flex-start}.brand-mark img{width:50px;height:50px}.brand-mark b{font-size:23px}.brand-copy{margin-top:42px}.brand-copy small{margin-bottom:8px}.brand-copy h1{font-size:34px}.brand-copy p{display:none}.brand-foot{display:none}.brand-panel:before{width:280px;height:280px;right:-130px;top:-105px}.login-panel{min-height:calc(100vh - 270px);padding:34px 22px 46px;align-items:flex-start}.login-panel h2{font-size:28px}}@media(max-width:420px){.brand-panel{min-height:238px}.brand-copy{margin-top:30px}.brand-copy h1{font-size:30px}.login-panel{min-height:calc(100vh - 238px);padding-top:28px}}
</style><link rel="prefetch" href="teacher.html"><link rel="prefetch" href="student.html"></head><body><main class="login-page"><section class="brand-panel"><div class="brand-mark"><img src="assets/yunting-logo.png" alt="云听心理"><div><b>云听</b><span>AI 智慧心理教室</span></div></div><div class="brand-copy"><small>学校心理课堂平台</small><h1><span>听见每一次成长，</span><span>陪伴每一间课堂。</span></h1><p>老师开课、管理班级与持续观察；学生进入课堂并获得自己的成长支持。</p></div><div class="brand-foot">面向学校心理课堂的教学与成长支持平台</div></section><section class="login-panel"><div class="login-inner"><div class="continue" id="continue"></div><h2>账号登录</h2><p class="login-lead">选择身份，进入对应空间。</p><div class="role-tabs"><button type="button" class="active" data-role="teacher">老师</button><button type="button" data-role="student">学生</button></div><form id="login-form"><label>账号<input id="account" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="login-button" type="submit">进入老师端</button><p class="error" id="error"></p></form><div class="demo-box"><b>体验账号</b><p class="demo-credential" id="demo-copy"></p><button class="demo-copy" id="fill-demo" type="button">填入当前身份的体验账号</button></div><p class="security-note">当前为静态体验版，登录与改密仅保存在此浏览器中。</p></div></section></main><script>
(function(){'use strict';var role='teacher',accounts={teacher:{account:'teacher01',name:'张老师',target:'teacher.html?view=dashboard'},student:{account:'student01',name:'陈予安',target:'student.html'}},form=document.getElementById('login-form'),account=document.getElementById('account'),password=document.getElementById('password'),error=document.getElementById('error'),copy=document.getElementById('demo-copy'),button=form.querySelector('.login-button'),params=new URLSearchParams(location.search);function pass(){return window.YTAuthDemo?YTAuthDemo.passwords():{teacher:'Teacher@2026',student:'Student@2026'}}function select(next){role=next;document.querySelectorAll('[data-role]').forEach(function(x){x.classList.toggle('active',x.dataset.role===role)});var x=accounts[role];account.placeholder=role==='teacher'?'请输入老师账号':'请输入学生账号';button.textContent=role==='teacher'?'登录老师端':'登录学生端';copy.textContent=x.account+' / '+pass()[role];error.textContent=''}document.querySelectorAll('[data-role]').forEach(function(x){x.onclick=function(){select(x.dataset.role)}});document.getElementById('fill-demo').onclick=function(){var x=accounts[role];account.value=x.account;password.value=pass()[role];account.focus()};form.onsubmit=function(e){e.preventDefault();var x=accounts[role];if(account.value.trim()!==x.account||password.value!==pass()[role]){error.textContent='账号或密码不正确，请核对所选身份。';return}sessionStorage.setItem('yunting-demo-auth-v1',JSON.stringify({role:role,account:x.account,name:x.name,loginAt:Date.now()}));var next=params.get('next');if(next&&((role==='teacher'&&next.indexOf('teacher')===0)||(role==='student'&&['student.html','student-space.html','daily-record.html','course.html','review.html'].some(function(p){return next.indexOf(p)===0}))))location.href=next;else location.href=x.target};var current;try{current=JSON.parse(sessionStorage.getItem('yunting-demo-auth-v1')||'null')}catch(e){}if(current&&accounts[current.role]){var c=document.getElementById('continue'),x=accounts[current.role];c.style.display='block';c.innerHTML='当前已登录为 <b>'+current.name+'</b>，<a href="'+x.target+'">继续进入'+(current.role==='teacher'?'老师端':'学生端')+'</a>。'}select(params.get('role')==='student'?'student':'teacher');if(params.get('reason')==='role')error.textContent='当前账号没有该角色页面权限，请切换账号登录。';if(params.get('reason')==='logout')error.textContent='已退出当前账号。'})();
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js?v=6").catch(function(){})}</script></body></html>
