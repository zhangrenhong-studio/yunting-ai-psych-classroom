<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云听 · 第一课教学支持预览</title><link rel="stylesheet" href="assets/lesson1-teacher-support.css"><style>*{box-sizing:border-box}body{margin:0;background:#f4f8f6;color:#193e35;font:16px/1.7 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:36px 24px}header{background:white;border:1px solid #dce8e1;border-radius:22px;padding:28px}h1{font-size:28px;margin:8px 0 14px}p{margin:6px 0;color:#50665e}.label{font-size:13px;color:#32785f}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}nav button,.full{border:1px solid #cdddce;background:white;border-radius:12px;padding:12px 16px;font:inherit;color:#245a47;cursor:pointer}nav button[aria-selected=true]{background:#286d55;color:white;border-color:#286d55}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}.full{text-decoration:none}.note{font-size:13px;margin-top:18px}#guide{max-width:850px;margin:auto}@media(max-width:600px){main{padding:18px 14px}header{padding:20px}h1{font-size:23px}nav{display:grid;grid-template-columns:1fr 1fr}nav button{font-size:14px;padding:10px}}</style><main><header><div class="label">云听 · 第一课独立预览 · 不影响正式站</div><h1>换了新环境，慢一点也没关系</h1><p>先查看完整教案，再切换下方环节，查看老师与学生分别要做什么。</p><div class="actions"><span id="plan"></span><a class="full" href="index.html">进入完整平台体验 →</a></div><p class="note">此页直接展示平台使用的同一套教案与教学提醒组件。下方切换仅供预览，不控制学生进度。完整平台为静态体验版。</p></header><nav id="stages" aria-label="查看各环节教学提醒"></nav><section id="guide"></section></main><script src="assets/lesson1-teaching-data.js"></script><script src="assets/lesson1-teacher-support.js"></script><script>const names={enter:'课前准备',story:'故事引导',talk:'AI互动陪伴',energy:'心理能量成长训练',playground:'成长训练场',closing:'心语留言'};document.querySelector('#plan').innerHTML=YTTeacherSupport.courseButton('lesson-01');function show(s){document.querySelector('#guide').innerHTML=YTTeacherSupport.guide(s);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.stage===s)))}document.querySelector('#stages').innerHTML=Object.entries(names).map(([s,n])=>'<button data-stage="'+s+'" aria-selected="false">'+n+'</button>').join('');document.querySelector('#stages').addEventListener('click',e=>{if(e.target.dataset.stage)show(e.target.dataset.stage)});show('enter');</script></html>
