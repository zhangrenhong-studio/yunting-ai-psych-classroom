/* 手环弹窗 */
.wearable-modal {
  position: fixed;
  z-index: 1000;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
}
.wearable-modal[hidden] { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(22, 52, 58, .34); backdrop-filter: blur(5px); }
.wearable-dialog {
  position: relative;
  z-index: 1;
  width: min(460px, 100%);
  max-height: calc(100dvh - 40px);
  overflow: auto;
  padding: 30px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 24px;
  background: #fbfefd;
  box-shadow: 0 30px 80px rgba(21, 66, 66, .25);
}
.modal-close { position: absolute; top: 12px; right: 14px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: #6e858a; font-size: 25px; cursor: pointer; }
.wearable-dialog h2 { margin: 0 42px 7px 0; font-size: 27px; letter-spacing: -.03em; }
.modal-intro { margin: 0 0 21px; color: var(--muted); font-size: 13px; }
.connection-state { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; color: #5a7479; font-weight: 800; }
.connection-state i { width: 11px; height: 11px; border-radius: 50%; background: #aebfbd; }
.connection-state.connected { color: var(--teal-dark); }
.connection-state.connected i { background: #36b887; box-shadow: 0 0 0 4px rgba(54,184,135,.13); }
.pair-form { display: grid; gap: 11px; }
.pair-form label { color: #47666d; font-size: 13px; font-weight: 750; }
.pair-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px; }
.pair-row input { min-width: 0; height: 48px; padding: 0 14px; border: 1px solid #cbded9; border-radius: 12px; background: #fff; color: var(--ink); letter-spacing: .22em; outline: none; }
.pair-row input:focus { border-color: #54ad9d; box-shadow: 0 0 0 3px rgba(84,173,157,.12); }
.pair-row button,
.wearable-dialog .primary-button { min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--teal); color: #fff; font-weight: 800; cursor: pointer; }
.band-message { min-height: 19px; margin: 0; color: var(--danger); font-size: 12px; }
.device-panel { padding: 18px; border-radius: 17px; background: #edf8f4; }
.device-panel span, .device-panel strong { display: block; }
.device-panel span { color: #648079; font-size: 12px; }
.device-panel strong { margin: 3px 0 11px; font-size: 25px; }
.device-panel p { margin: 0; color: #58736e; font-size: 13px; }
.wearable-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 17px; }
.wearable-actions button { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: #345c5a; font-weight: 750; cursor: pointer; }
.wearable-actions .danger { color: var(--danger); }
.truth-note { margin: 16px 0 0; color: #78908e; font-size: 11px; }

/* 老师开课后的既有接管层 */
.classroom-overlay { position: fixed; z-index: 30; inset: 0; display: grid; place-items: center; overflow: hidden; background: linear-gradient(145deg,#e5faf0,#eaf8ff); }
.classroom-glow { position: absolute; width: min(75vw,900px); height: min(75vw,900px); border-radius: 50%; background: radial-gradient(circle,#a7f3d0 0%,rgba(186,230,253,.2) 38%,transparent 70%); filter: blur(12px); }
.classroom-call { position: relative; z-index: 2; width: min(620px,calc(100% - 44px)); padding: 52px; text-align: center; border-radius: 28px; background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 32px 72px -44px rgba(36,91,91,.5); }
.classroom-call h2 { margin: 0 0 12px; font-size: clamp(28px,4vw,42px); }
.classroom-call p:not(.eyebrow) { margin: 0; color: var(--muted); }
.cta { display: inline-block; margin-top: 25px; border: 0; border-radius: 13px; padding: 12px 22px; background: var(--teal); color: #fff; font-weight: 800; cursor: pointer; }
.classroom-call small { display: block; margin-top: 13px; color: var(--muted); }
.classroom-band { display: grid; gap: 7px; margin: 14px 0; padding: 12px; border: 1px solid #cce5df; border-radius: 12px; background: #f6fbfa; text-align: left; }
.classroom-band > div { display: flex; gap: 7px; }
.classroom-band input { min-width: 0; flex: 1; padding: 9px 10px; border: 1px solid #c9dbd7; border-radius: 8px; }
.classroom-band button { padding: 9px 13px; border: 0; border-radius: 8px; background: #168677; color: #fff; font-weight: 700; }
.classroom-band span { color: #71847f; font-size: 11px; }
.classroom-band.connected { background: #eaf8f3; }

@media (max-width: 620px) {
  .wearable-dialog { padding: 25px 20px; border-radius: 20px; }
  .wearable-dialog h2 { font-size: 24px; }
}
