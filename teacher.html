<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云听｜老师工作台</title><style>
:root{--bg-grad:linear-gradient(135deg,#f0fdf4 0%,#eff6ff 50%,#faf5ff 100%);--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--teal:#10b981;--teal-dark:#059669;--teal-light:#ecfdf5;--white:#fff;--orange:#f59e0b;--red:#ef4444;--blue:#3b82f6}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-grad);min-height:100vh;color:var(--ink);font-size:14px}.app{display:flex;min-height:100vh}.sidebar{width:240px;background:var(--white);border-right:1px solid var(--line);padding:24px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}.sidebar-logo{padding:0 24px 24px;border-bottom:1px solid var(--line)}.sidebar-logo h1{font-size:20px;font-weight:700;color:var(--teal-dark)}.sidebar-logo p{font-size:12px;color:var(--muted);margin-top:2px}.sidebar-group{padding:20px 24px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);opacity:.7}.sidebar a{display:flex;align-items:center;gap:10px;padding:10px 24px;color:var(--ink);text-decoration:none;font-size:14px;transition:all .2s;border-left:3px solid transparent}.sidebar a:hover{background:var(--teal-light);color:var(--teal-dark)}.sidebar a.active{background:var(--teal-light);color:var(--teal-dark);font-weight:600;border-left-color:var(--teal)}.sidebar a i{font-style:normal;width:20px;text-align:center;font-size:16px}.main{flex:1;min-width:0;padding:24px 32px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.header h2{font-size:24px;font-weight:700}.header p{font-size:14px;color:var(--muted);margin-top:4px}.header-right{display:flex;align-items:center;gap:12px}.header-badge{padding:6px 14px;background:var(--teal-light);color:var(--teal-dark);border-radius:20px;font-size:12px;font-weight:500}.content-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px}.stat-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.04);position:relative;overflow:hidden}.stat-card::after{content:'';position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;opacity:.1;background:var(--teal)}.stat-card.orange::after{background:var(--orange)}.stat-card.red::after{background:var(--red)}.stat-label{font-size:14px;color:var(--muted);margin-bottom:8px}.stat-value{font-size:36px;font-weight:700;line-height:1}.stat-trend{font-size:12px;margin-top:8px;color:var(--teal-dark)}.stat-trend.down{color:var(--red)}.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px}.panel-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}.alert-list{display:flex;flex-direction:column;gap:10px}.alert-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:all .2s;background:#fff}.alert-item:hover{border-color:var(--teal);transform:translateX(4px)}.alert-item.warning{border-left:3px solid var(--orange)}.alert-item.danger{border-left:3px solid var(--red)}.alert-student{flex:1}.alert-name{font-weight:600;font-size:14px}.alert-desc{font-size:12px;color:var(--muted);margin-top:2px}.tag{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500}.tag-green{background:#dcfce7;color:#166534}.tag-yellow{background:#fef3c7;color:#92400e}.tag-red{background:#fee2e2;color:#991b1b}.tag-blue{background:#dbeafe;color:#1e40af}.tag-gray{background:#f1f5f9;color:#64748b}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick-btn{padding:18px;border:1px solid var(--line);border-radius:12px;text-align:center;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s;background:#fff}.quick-btn:hover{border-color:var(--teal);background:var(--teal-light);color:var(--teal-dark);transform:translateY(-2px)}.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.chart-box{padding:24px;border:1px solid var(--line);border-radius:12px;background:#fff}.chart-title{font-size:14px;font-weight:600;margin-bottom:16px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;padding:12px 16px;background:#f8fafc;font-weight:600;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}.table td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px}.table tr:hover td{background:#f8fafc}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;font-size:14px;color:var(--muted)}.tab.active{color:var(--teal-dark);border-bottom-color:var(--teal);font-weight:600}.tab-count{display:inline-block;margin-left:6px;padding:1px 8px;background:#e2e8f0;border-radius:10px;font-size:11px;line-height:18px}.student-profile{display:flex;align-items:center;gap:16px;padding:24px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:20px}.avatar-lg{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}.profile-info{flex:1}.profile-name{font-size:22px;font-weight:700}.profile-meta{display:flex;gap:20px;font-size:13px;color:var(--muted);margin-top:6px}.profile-actions button{padding:10px 18px;background:var(--teal);color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:14px}.info-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.info-card{padding:20px;border:1px solid var(--line);border-radius:12px;background:#fff;border-left:4px solid var(--teal)}.info-card.blue{border-left-color:var(--blue)}.info-card.gray{border-left-color:var(--muted)}.info-card-title{font-size:13px;color:var(--muted);margin-bottom:8px}.info-card-value{font-size:24px;font-weight:700;margin-bottom:6px}.info-card-desc{font-size:12px;color:var(--muted)}.detail-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0}.detail-tab{padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;font-size:14px;color:var(--muted)}.detail-tab.active{color:var(--teal-dark);border-bottom-color:var(--teal);font-weight:600}.detail-panel{display:none}.detail-panel.active{display:block}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.info-item{padding:8px 0}.info-label{font-size:12px;color:var(--muted);margin-bottom:4px}.info-value{font-size:14px;font-weight:500}.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.class-card{padding:24px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:all .2s}.class-card:hover{border-color:var(--teal);box-shadow:0 4px 12px rgba(16,185,129,.1);transform:translateY(-2px)}.class-name{font-size:16px;font-weight:600;margin-bottom:12px}.class-stats{display:flex;gap:20px;font-size:12px;color:var(--muted)}.class-stat-val{font-size:20px;font-weight:700;color:var(--ink)}.search-bar{display:flex;gap:12px;margin-bottom:20px}.search-bar input{flex:1;max-width:300px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px}.search-bar select{padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}.search-bar .btn-primary{padding:10px 18px;background:var(--teal);color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:14px;margin-left:auto}.wall-note{display:inline-block;width:140px;min-height:110px;vertical-align:top;padding:14px;margin:12px 10px 0 0;background:#fff9cf;box-shadow:0 10px 20px -17px #766f45;transform:rotate(-1deg);font-size:13px;border-radius:4px}.wall-note:nth-child(2){background:#e7f7ff;transform:rotate(1deg)}.empty-state{padding:60px;text-align:center;color:var(--muted)}.filter-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}.filter-bar select{padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;min-width:120px}</style><link rel="stylesheet" href="assets/support-flow.css?v=flow-1"></head><body><div class="app"><aside class="sidebar"><div class="sidebar-logo"><h1>云听</h1><p>AI 智慧心理教室 · 老师端</p></div><div class="sidebar-group">工作台</div><a href="teacher.html?view=dashboard" data-view="dashboard"><i>⌂</i>工作台首页</a><div class="sidebar-group">教学流程</div><a href="teacher.html?view=launch" data-view="launch"><i>▶</i>开课准备</a><a href="teacher.html?view=records" data-view="records"><i>▤</i>课堂记录</a><a href="teacher.html?view=courses" data-view="courses"><i>▦</i>课程管理</a><div class="sidebar-group">数据洞察</div><a href="teacher.html?view=data-overview" data-view="data-overview"><i>◉</i>数据总览</a><a href="teacher.html?view=data-distribution" data-view="data-distribution"><i>◈</i>综合数据</a><a href="teacher.html?view=data-trend" data-view="data-trend"><i>↗</i>数据趋势</a><a href="teacher.html?view=data-index" data-view="data-index"><i>⊚</i>指数详情</a><a href="teacher.html?view=attendance" data-view="attendance"><i>✓</i>签到统计</a><div class="sidebar-group">班级与学生</div><a href="teacher.html?view=classes" data-view="classes"><i>▣</i>班级管理</a><a href="teacher.html?view=students" data-view="students"><i>◎</i>学生总览</a><a href="teacher.html?view=warning" data-view="warning"><i>⚠</i>学生预警</a><div class="sidebar-group">学生关怀</div><a href="teacher.html?view=follow" data-view="follow"><i>✦</i>私密关注</a><a href="teacher.html?view=wall" data-view="wall"><i>▧</i>留言墙动态</a></aside><div class="main"><header class="header"><div><h2 id="page-title">工作台首页</h2><p id="page-desc">快速预览今天需要关注的学生和待办事项</p></div><div class="header-right"><span class="header-badge">预览版</span><span>张老师</span></div></header><div id="content"></div></div></div><script src="courses/index.js?v=platform-6"></script><script src="assets/classroom-state.js?v=platform-6"></script><script src="assets/demo-data.js?v=demo-1"></script><script src="assets/support-flow.js?v=flow-1"></script><script>
window.YTSeedDemo&&window.YTSeedDemo.ensure();
(function(){
var view=new URLSearchParams(location.search).get('view')||'dashboard',
main=document.getElementById('content'),
stages=['enter','story','talk','energy','playground','closing'],
labels={enter:'进入课堂',story:'故事导入',talk:'和小悦悦聊聊',energy:'心理能量补给',playground:'成长训练场',closing:'收束与尾声'},
copy={enter:'先安静下来，知道今天会一起经历什么。',story:'从故事进入主题并完成个人表达。',talk:'学生在各自设备中进行主题相关的私密表达。',energy:'聆听本节课配置的心理能量音乐。',playground:'自主选择一个能力训练小游戏。',closing:'让学生选一种此刻的颜色，决定是否留下什么。'};
document.querySelector('[data-view="'+view+'"]')?.classList.add('active');

function all(){try{var rows=JSON.parse(localStorage.getItem('yunting-class-records-v1'))||[],seen={};return rows.filter(function(x){var id=x.sessionId||('legacy-'+x.at+'-'+x.title);if(seen[id])return false;seen[id]=true;return true})}catch(e){return[]}}
function records(){var r=all();return r.length?'<div class="record-grid">'+r.map(function(x,i){var expected=x.expectedStudents==null?'—':x.expectedStudents,actual=x.actualStudents==null?'—':x.actualStudents,rate=expected==='—'||actual==='—'||!expected?'—':Math.round(actual/expected*100)+'%';return '<a class="class-record-card" href="teacher-record.html?session='+encodeURIComponent(x.sessionId||'latest')+'"><span class="record-mark record-mark-'+(i%4)+'">课</span><div class="record-body"><p class="record-meta">'+new Date(x.at).toLocaleDateString('zh-CN')+' · '+x.status+'</p><h3>'+x.title+'</h3><p>'+x.className+'</p><div class="record-stats"><span>应到 <b>'+expected+'</b></span><span>实到 <b>'+actual+'</b></span><span>到课 <b>'+rate+'</b></span></div><em>查看课堂记录 →</em></div></a>'}).join('')+'</div>':'<div class="empty-state">还没有课堂记录。</div>'}
function recover(){var s=YTClassroomDemo.read();return s.status==='ended'&&s.endedAt&&Date.now()-s.endedAt<600000?'<div class="content-card" style="margin-bottom:20px"><b>刚刚结束了一场课堂</b><p style="color:var(--muted);margin:8px 0 12px">如果是误操作，可以在结束后的 10 分钟内恢复到原来的课堂环节。</p><button class="btn-primary" id="recover-class" style="padding:10px 18px;background:var(--teal);color:#fff;border:0;border-radius:8px;cursor:pointer">恢复刚刚结束的课堂</button></div>':''}
function live(){var s=YTClassroomDemo.read();if(!s.active)return '<div class="content-card"><p class="empty-state">等待老师开始</p></div>';return '<div class="content-card"><span style="padding:6px 12px;background:#fee2e2;color:#991b1b;border-radius:20px;font-size:12px">● 课堂进行中 · '+s.className+'</span><h3 style="margin:20px 0 8px">'+s.courseTitle+'</h3><div style="font-size:20px;font-weight:600;margin-bottom:8px">'+labels[s.stage]+'</div><p style="color:var(--muted);margin-bottom:20px">'+copy[s.stage]+'</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">'+stages.map(v=>'<button class="'+(s.stage===v?'btn-primary':'')+'" data-stage="'+v+'" style="padding:8px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer">'+labels[v]+'</button>').join('')+'</div><div style="display:flex;gap:10px"><button id="pause" style="padding:10px 16px;border:1px solid var(--line);border-radius:8px;cursor:pointer">'+(s.paused?'继续课堂':'暂停课堂')+'</button><button id="next" style="padding:10px 16px;background:var(--teal);color:#fff;border:0;border-radius:8px;cursor:pointer">下一环节</button><button id="end" style="padding:10px 16px;background:#ef4444;color:#fff;border:0;border-radius:8px;cursor:pointer">结束课堂</button></div></div>'}
function classes(){try{var rows=JSON.parse(localStorage.getItem('yunting-class-groups-v1'));return Array.isArray(rows)?rows:[]}catch(e){return[]}}
function studentCount(classId){try{var rows=JSON.parse(localStorage.getItem('yunting-class-students-v1'));return Array.isArray(rows)?rows.filter(function(x){return x.classId===classId}).length:0}catch(e){return 0}}
function classPicker(){var rows=classes();if(!rows.length)return '<div class="empty-state">还没有可选班级，请先到班级管理中创建班级</div>';return '<label style="display:block;margin-bottom:16px;font-size:14px">上课班级 <small style="color:var(--muted)">可多选</small><div style="position:relative;margin-top:8px"><button type="button" id="class-select-toggle" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left">请选择班级 <span style="float:right">⌄</span></button><div id="class-select-menu" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:4px;padding:8px;z-index:10">'+rows.map(function(x){var grade=x.grade||'未设置年级';return '<label style="display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;font-size:14px"><input type="checkbox" data-class-pick value="'+x.id+'" data-count="'+studentCount(x.id)+'" data-name="'+x.name+'" data-grade="'+grade+'"><span>'+grade+' · '+x.name+'</span></label>'}).join('')+'<button type="button" id="class-select-done" style="width:100%;padding:10px;background:var(--teal);color:#fff;border:0;border-radius:8px;cursor:pointer;margin-top:8px">完成选择</button></div></div></label>'}
function courseOptionsFor(grades){var names=Array.from(new Set(grades));if(!names.length)return '<label style="display:block;margin-bottom:16px;font-size:14px">上课课程<select id="course" disabled style="width:100%;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:8px"><option>请先选择班级</option></select></label>';if(names.length!==1)return '<label style="display:block;margin-bottom:16px;font-size:14px">上课课程<select id="course" disabled style="width:100%;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:8px"><option>不同年级不能共用同一门年级课程</option></select></label>';var lib=window.COURSE_LIBRARY||{stages:[]},items=[],picked=pending();lib.stages.forEach(function(stage){stage.grades.forEach(function(g){if(g.name===names[0])g.courses.forEach(function(c){if(c.courseId)items.push(c)})})});if(!items.length)return '<label style="display:block;margin-bottom:16px;font-size:14px">上课课程<select id="course" disabled style="width:100%;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:8px"><option>'+names[0]+' 暂无可开课课程</option></select></label>';var valid=items.some(function(c){return c.courseId===picked.id});return '<label style="display:block;margin-bottom:16px;font-size:14px">上课课程<select id="course" style="width:100%;padding:12px;margin-top:8px;border:1px solid var(--line);border-radius:8px">'+items.map(function(c){return '<option value="'+c.courseId+'" data-title="'+c.title+'"'+(valid&&c.courseId===picked.id?' selected':'')+'>'+c.title+'</option>'}).join('')+'</select></label>'}
function pending(){try{return JSON.parse(localStorage.getItem('yunting-pending-course-v1'))||{id:'lesson-01',title:'走进初中，拥抱新起点'}}catch(e){return{id:'lesson-01',title:'走进初中，拥抱新起点'}}}
function launch(){var p=pending();return '<div class="content-card"><h3 style="font-size:18px;font-weight:600;margin-bottom:8px">安排课堂</h3><p style="color:var(--muted);margin-bottom:20px">从课程管理带入：<b>'+p.title+'</b>，你仍可在下面更换本次课程。</p>'+classPicker()+'<div id="course-slot">'+courseOptionsFor([])+'</div><label style="display:block;margin-bottom:24px;font-size:14px">课堂推进方式<div style="display:flex;gap:12px;margin-top:12px"><label style="flex:1;padding:16px;border:1px solid var(--line);border-radius:10px;cursor:pointer"><input type="radio" name="progress-mode" value="teacher" checked><b style="display:block;margin:8px 0 4px">老师统一控制</b><span style="font-size:12px;color:var(--muted)">学生完成当前环节后等待，由老师带大家一起进入下一环节。</span></label><label style="flex:1;padding:16px;border:1px solid var(--line);border-radius:10px;cursor:pointer"><input type="radio" name="progress-mode" value="student"><b style="display:block;margin:8px 0 4px">学生自主探索</b><span style="font-size:12px;color:var(--muted)">老师开始课堂后，学生可以按自己的节奏完成并进入下一环节。</span></label></div></label><button id="launch" style="padding:12px 24px;background:var(--teal);color:#fff;border:0;border-radius:8px;cursor:pointer">创建课堂</button><p style="color:var(--muted);font-size:12px;margin-top:16px">当前为同一浏览器的前端流程模拟。真实班级配对、跨设备推送、登录与权限需接入后端实时服务。</p></div>'}
function courseLibrary(){var lib=window.COURSE_LIBRARY||{stages:[],specials:[]},html='<div class="content-card"><h3 style="font-size:18px;font-weight:600;margin-bottom:8px">课程管理</h3><p style="color:var(--muted);margin-bottom:20px">按学段与年级浏览。每张卡片是一节独立课程；已完成内容包可直接进入开课准备。</p><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><label style="font-size:14px">查看年级 <select id="course-grade-filter" style="padding:10px 14px;margin-left:8px;border:1px solid var(--line);border-radius:8px"><option value="all">全部年级</option><option value="七年级">七年级</option><option value="八年级">八年级</option><option value="九年级">九年级</option><option value="高一">高一</option><option value="高二">高二</option><option value="高三">高三</option></select></label><span style="font-size:12px;color:var(--muted)">已完成课程可直接选课</span></div>';lib.stages.forEach(function(stage){html+='<div style="margin-bottom:24px"><h4 style="font-size:15px;font-weight:600;margin-bottom:4px;color:var(--teal-dark)">'+stage.name+'</h4><p style="font-size:13px;color:var(--muted);margin-bottom:16px">'+stage.blurb+'</p>';stage.grades.forEach(function(grade){html+='<div class="course-grade" data-grade="'+grade.name+'" style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>'+grade.name+'</b><span style="font-size:12px;color:var(--muted)">'+grade.courses.length+' 节课程</span></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">';grade.courses.forEach(function(course,i){var ready=!!course.courseId,action=ready?'<button class="course-choose" data-course="'+course.courseId+'" data-title="'+course.title+'" style="padding:6px 12px;background:var(--teal);color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:12px">选课 →</button>':'<span style="font-size:12px;color:var(--muted)">内容建设中</span>';html+='<div style="padding:16px;border:1px solid var(--line);border-radius:10px"><span style="font-size:11px;co var head={dashboard:['工作台首页','快速预览今天需要关注的学生和待办事项'],launch:['开课准备','选择班级、课程和推进方式'],records:['课堂记录','查看本次课堂的班级、应到实到和教师人工观察'],courses:['课程管理','按班级安排课程、主题和开放时间'],'data-overview':['数据动态汇总','全校学生心理测评数据整体情况'],'data-distribution':['综合数据','按性别、年级、班级查看数据分布'],'data-trend':['数据趋势','近6个月测评得分变化趋势'],'data-index':['指数详情','各心理维度得分详情'],attendance:['签到统计','学生课堂出勤情况'],classes:['班级管理','创建班级、维护学生人数'],students:['学生总览','全校学生的全局视图'],'student-detail':['学生详情','学生完整信息：测评、方案、账号、考勤'],warning:['学生预警','需重点关注的学生列表'],follow:['私密关注','仅处理学生主动提交给老师的内容'],wall:['留言墙动态','班级共同表达可见；与私密关注、自由对话严格分开']};

function page(){

else if(view==='data-trend')body=dataTrend();
else if(view==='data-index')body=dataIndex();
else if(view==='attendance')body=attendance();
else if(view==='students')body=studentsView();
else if(view==='student-detail')body=studentDetail();
else if(view==='warning')body=warning();
else if(view==='classes')body='<div class="content-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3 style="font-size:18px;font-weight:600">班级列表</h3><a href="teacher-class-create.html" style="padding:10px 18px;background:var(--teal);color:#fff;border-radius:8px;text-decoration:none;font-size:14px">+ 创建班级</a></div><div class="class-grid"><div class="class-card" onclick="location.href=\'teacher-class.html\'"><div class="class-name">四年级一班</div><div class="class-stats"><div><div class="class-stat-val">15</div><div>学生数</div></div><div><div class="class-stat-val">1</div><div>已测评</div></div><div><div class="class-stat-val" style="color:var(--red)">0</div><div>预警数</div></div></div></div><div class="class-card" onclick="location.href=\'teacher-class.html\'"><div class="class-name">五年级一班</div><div class="class-stats"><div><div class="class-stat-val">18</div><div>学生数</div></div><div><div class="class-stat-val">2</div><div>已测评</div></div><div><div class="class-stat-val" style="color:var(--red)">0</div><div>预警数</div></div></div></div><div class="class-card" onclick="location.href=\'teacher-class.html\'"><div class="class-name">六年级一班</div><div class="class-stats"><div><div class="class-stat-val">20</div><div>学生数</div></div><div><div class="class-stat-val">2</div><div>已测评</div></div><div><div class="class-stat-val" style="color:var(--red)">0</div><div>预警数</div></div></div></div></div></div>';
else if(view==='follow')body='<div class="content-card"><h3 style="font-size:18px;font-weight:600;margin-bottom:8px">私密关注</h3><p style="color:var(--muted);margin-bottom:20px">只接收学生明确提交给老师的内容；普通聊天、每日记录和留言墙不会自动进入。</p><div id="support-inbox">'+YTSupportFlow.renderInbox()+'</div><p style="color:var(--muted);font-size:12px;margin-top:20px">当前为同一浏览器流程演示。真实上线需接入学校通知、响应时限、负责人和操作审计。</p></div>';
else if(view==='courses')body=courseLibrary();
else if(view==='launch')body=recover()+live()+launch();
else if(view==='records')body='<div class="content-card"><h3 style="font-size:18px;font-weight:600;margin-bottom:20px">本次课上得怎么样</h3>'+recover()+records()+'<div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line)"><b>课堂观察维度（不做心理评分）</b><p style="color:var(--muted);margin:8px 0 0;font-size:13px">可由老师基于课程参与、学生主动授权的表达、原话上下文和自己的课后记录进行人工理解。系统不把一次课堂表现换算成心理分数、疾病标签或风险等级。</p></div></div>';
else body='<div class="content-card"><div class="panel-title">留言墙动态</div><span class="wall-note">慢一点也没关系。<br><small>匿名同学</small></span><span class="wall-note">今天愿意开口，就已经很好了。<br><small>匿名同学</small></span><p style="font-size:12px;color:var(--muted);margin-top:16px">无需审核；不作为私密求助或老师处理入口。</p></div>';
main.innerHTML=body;

}

function bind(){var recoverButton=document.getElementById('recover-class');if(recoverButton)recoverButton.onclick=function(){var s=YTClassroomDemo.read();if(!(s.status==='ended'&&s.endedAt&&Date.now()-s.endedAt<600000))return;s.active=true;s.status='live';s.endedAt=null;YTClassroomDemo.write(s);var rows=all().filter(function(x){return x.sessionId!==s.sessionId});rows.unshift({sessionId:s.sessionId,title:s.courseTitle,className:s.className,at:s.startedAt||s.createdAt,status:'进行中',expectedStudents:s.expectedStudents,actualStudents:s.actualStudents,reachedStages:s.reachedStages||[],demo:true});localStorage.setItem('yunting-class-records-v1',JSON.stringify(rows.slice(0,20)));location.href='teacher-course.html?session='+encodeURIComponent(s.sessionId)};var inbox=document.getElementById('support-inbox');if(inbox)YTSupportFlow.bindInbox(inbox,page);var courseGradeFilter=document.getElementById('course-grade-filter');if(courseGradeFilter){courseGradeFilter.onchange=function(){var picked=courseGradeFilter.value;document.querySelectorAll('.course-grade').forEach(function(group){group.hidden=picked!=='all'&&group.dataset.grade!==picked})}}document.querySelectorAll('[data-course]').forEach(function(choice){choice.onclick=function(){localStorage.setItem('yunting-pending-course-v1',JSON.stringify({id:choice.dataset.course,title:choice.dataset.title}));location.href='teacher.html?view=launch'}});var picks=Array.from(document.querySelectorAll('[data-class-pick]')),slot=document.getElementById('course-slot'),selectToggle=document.getElementById('class-select-toggle'),selectMenu=document.getElementById('class-select-menu');function syncCourses(){var chosen=picks.filter(function(x){return x.checked});if(slot)slot.innerHTML=courseOptionsFor(chosen.map(function(x){return x.dataset.grade}))}if(selectToggle)selectToggle.onclick=function(){selectMenu.style.display=selectMenu.style.display==='block'?'none':'block'};var selectDone=document.getElementById('class-select-done');if(selectDone)selectDone.onclick=function(){selectMenu.style.display='none';var course=document.getElementById('course');if(course&&!course.disabled)course.focus()};picks.forEach(function(x){x.onchange=syncCourses});syncCourses();var b=document.getElementById('launch');if(b)b.onclick=function(){var selected=Array.from(document.querySelectorAll('[data-class-pick]:checked')),co=document.getElementById('course');if(!selected.length){alert('请至少选择一个上课班级');return}if(!co||co.disabled){alert('请为所选年级选择可开课的课程');return}var o=co.options[co.selectedIndex],mode=(document.querySelector('input[name="progress-mode"]:checked')||{}).value||'teacher',now=Date.now(),sessionId='demo-'+now,next={active:true,status:'waiting',progressMode:mode,studentStage:'enter',sessionId:sessionId,classId:selected.map(function(x){return x.value}).join(','),className:selected.map(function(x){return x.dataset.name}).join('、'),expectedStudents:selected.reduce(function(n,x){return n+(Number(x.dataset.count)||0)},0),actualStudents:null,presenceMode:'not-connected',courseId:co.value,courseTitle:o.dataset.title,teacherId:'teacher-demo-01',createdAt:now,startedAt:null,stageStartedAt:null,stage:'enter',reachedStages:[],studentProgress:{},paused:false};YTClassroomDemo.write(next);var r=all().filter(function(x){return x.sessionId!==sessionId});r.unshift({sessionId:sessionId,title:next.courseTitle,className:next.className,at:now,status:'等待开始',expectedStudents:next.expectedStudents,actualStudents:null,reachedStages:[],demo:true});localStorage.setItem('yunting-class-records-v1',JSON.stringify(r.slice(0,20)));location.href='teacher-course.html?session='+encodeURIComponent(sessionId)};document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=function(){var s=YTClassroomDemo.read();s.stage=b.dataset.stage;s.paused=false;YTClassroomDemo.write(s);page()});var s=YTClassroomDemo.read(),p=document.getElementById('pause'),n=document.getElementById('next'),e=document.getElementById('end');if(p)p.onclick=()=>{s.paused=!s.paused;YTClassroomDemo.write(s);page()};if(n)n.onclick=()=>{var i=stages.indexOf(s.stage);if(i<stages.length-1){s.stage=stages[i+1];s.stageStartedAt=Date.now();s.reachedStages=Array.from(new Set((s.reachedStages||[]).concat(s.stage)));s.paused=false;YTClassroomDemo.write(s);page()}};if(e)e.onclick=()=>{if(!confirm('确认结束本次课堂？结束后可在课堂记录中查看，并可在 10 分钟内恢复。'))return;s.active=false;s.status='ended';s.endedAt=Date.now();YTClassroomDemo.write(s);var r=all().filter(function(x){return x.sessionId!==s.sessionId});r.unshift({sessionId:s.sessionId,title:s.courseTitle,className:s.className,at:s.startedAt,status:'已结束',endedAt:s.endedAt,expectedStudents:s.expectedStudents,actualStudents:s.actualStudents,reachedStages:s.reachedStages||[s.stage],demo:true});localStorage.setItem('yunting-class-records-v1',JSON.stringify(r.slice(0,20)));page()}}var lastClassroom='';YTClassroomDemo.subscribe(function(){var x=YTClassroomDemo.read(),sig=[x.sessionId,x.active,x.stage,x.paused,x.updatedAt].join('|');if(sig!==lastClassroom){lastClassroom=sig;page();}});page();
})();
</script></body></html>
