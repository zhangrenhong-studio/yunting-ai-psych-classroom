g:10px 12px;background:#f8fafc;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}.table td{padding:12px;border-bottom:1px solid var(--line);font-size:13px}.table tr:hover td{background:#f8fafc}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;color:var(--muted)}.tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}.tab-count{display:inline-block;margin-left:4px;padding:0 6px;background:#e2e8f0;border-radius:8px;font-size:11px;line-height:16px}.student-profile{display:flex;align-items:center;gap:16px;padding:20px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.9);margin-bottom:16px}.avatar-lg{width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}.profile-info{flex:1}.profile-name{font-size:20px;font-weight:800}.profile-meta{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:4px}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.info-item{padding:10px 0}.info-label{font-size:12px;color:var(--muted);margin-bottom:4px}.info-value{font-size:14px;font-weight:600}.detail-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0}.detail-tab{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;color:var(--muted)}.detail-tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}.detail-panel{display:none}.detail-panel.active{display:block}.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.class-card{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer}.class-card:hover{border-color:var(--teal);box-shadow:0 4px 12px rgba(22,134,119,.1)}.class-name{font-size:16px;font-weight:700;margin-bottom:10px}.class-stats{display:flex;gap:16px;font-size:12px;color:var(--muted)}.class-stat-val{font-size:18px;font-weight:700;color:var(--ink)}.wall{background:var(--pink)}.wall-note{display:inline-block;width:130px;min-height:102px;vertical-align:top;padding:13px;margin:11px 8px 0 0;background:#fff9cf;box-shadow:0 10px 20px -17px #766f45;transform:rotate(-1deg);font-size:13px}.wall-note:nth-child(2){background:#e7f7ff;transform:rotate(1deg)}@media(max-width:760px){.shell{width:min(100% - 28px,1380px);padding-top:16px}.layout{grid-template-columns:1fr}.side{height:auto;min-height:auto;position:static;display:flex;gap:4px;overflow:auto;padding:8px}.side p,.side hr{display:none}.side a{white-space:nowrap;margin:0;font-size:13px}.grid{grid-template-columns:1fr}.head h1{font-size:28px}}</style><link rel="stylesheet" href="assets/support-flow.css?v=flow-1"></head><body><main class="shell"><header class="top"><a class="brand" href="teacher.html"><b>云听</b><span>AI 智慧心理教室 · 老师端</span></a><div class="student">学生端演示：<a href="index.html?platform=5">查看入口</a></div></header><div class="layout"><nav class="side" id="side"><p>🏠 工作台</p><a href="teacher.html?view=dashboard" data-view="dashboard"><i>⌂</i>工作台首页</a><hr><p>📋 教学流程</p><a href="teacher.html?view=launch" data-view="launch"><i>▶</i>开课准备</a><a href="teacher.html?view=records" data-view="records"><i>▤</i>课堂记录</a><a href="teacher.html?view=courses" data-view="courses"><i>▦</i>课程管理</a><hr><p>📊 数据洞察</p><a href="teacher.html?view=data-overview" data-view="data-overview"><i>◉</i>数据总览</a><a href="teacher.html?view=data-distribution" data-view="data-distribution"><i>◈</i>数据分布</a><a href="teacher.html?view=data-trend" data-view="data-trend"><i>↗</i>数据趋势</a><a href="teacher.html?view=data-index" data-view="data-index"><i>⊚</i>指数详情</a><hr><p>👥 班级与学生</p><a href="teacher.html?view=classes" data-view="classes"><i>▣</i>班级管理</a><a href="teacher.html?view=students" data-view="students"><i>◎</i>学生总览</a><hr><p>💛 学生关怀</p><a href="teacher.html?view=follow" data-view="follow"><i>✦</i>私密关注</a><a href="teacher.html?view=wall" data-view="wall"><i>▧</i>留言墙动态</a></nav><section class="main" id="main"></section></div></main><script src="courses/index.js?v=platform-6"></script><script src="assets/classroom-state.js?v=platform-6"></script><script src="assets/demo-data.js?v=demo-1"></script><script src="assets/support-flow.js?v=flow-1"></script><script>

(function(){
var view=new URLSearchParams(location.search).get('view')||'dashboard',
main=document.getElementById('main'),

labels={enter:'进入课堂',story:'故事导入',talk:'和小悦悦聊聊',energy:'心理能量补给',playground:'成长训练场',closing:'收束与尾声'},
copy={enter:'先安静下来，知道今天会一起经历什么。',story:'从故事进入主题并完成个人表达。',talk:'学生在各自设备中进行主题相关的私密表达。',energy:'聆听本节课配置的心理能量音乐。',playground:'自主选择一个能力训练小游戏。',closing:'让学生选一种此刻的颜色，决定是否留下什么。'};
document.querySelector('[data-view="'+view+'"]')?.classList.add('on');

function all(){try{var rows=JSON.parse(localStorage.getItem('yunting-class-records-v1'))||[],seen={};return rows.filter(function(x){var id=x.sessionId||('legacy-'+x.at+'-'+x.title);if(seen[id])return false;seen[id]=true;return true})}catch(e){return[]}}
function records(){var r=all();return r.length?'<div class="record-grid">'+r.map(function(x,i){var expected=x.expectedStudents==null?'—':x.expectedStudents,actual=x.actualStudents==null?'—':x.actualStudents,rate=expected==='—'||actual==='—'||!expected?'—':Math.round(actual/expected*100)+'%';return '<a class="class-record-card" href="teacher-record.html?session='+encodeURIComponent(x.sessionId||'latest')+'"><span class="record-mark record-mark-'+(i%4)+'">课</span><div class="record-body"><p class="record-meta">'+new Date(x.at).toLocaleDateString('zh-CN')+' · '+x.status+'</p><h3>'+x.title+'</h3><p>'+x.className+'</p><div class="record-stats"><span>应到 <b>'+expected+'</b></span><span>实到 <b>'+actual+'</b></span><span>到课 <b>'+rate+'</b></span></div><em>查看课堂记录 →</em></div></a>'}).join('')+'</div>':'<div class="empty">还没有课堂记录。</div>'}
function recover(){var s=YTClassroomDemo.read();return s.status==='ended'&&s.endedAt&&Date.now()-s.endedAt<600000?'<section class="observation"><b>刚刚结束了一场课堂</b><p>如果是误操作，可以在结束后的 10 分钟内恢复到原来的课堂环节。</p><button class="launch" id="recover-class">恢复刚刚结束的课堂</button></section>':''}
function live(){var s=YTClassroomDemo.read();if(!s.active)return '<section class="panel status"><p class="eyebrow">当前课堂</p><h2>等待老师开始</h2><p class="empty">选择班级、课程并点击「一键上课」后，学生端会进入课堂模式。</p></section>';return '<section class="panel status"><span class="live-tag">● 课堂进行中 · '+s.className+'</span><p class="eyebrow" style="margin-top:18px">'+s.courseTitle+'</p><div class="stage-name">'+labels[s.stage]+'</div><p class="stage-copy">'+copy[s.stage]+'</p><div class="stage-buttons">'+stages.map(v=>'<button class="'+(s.stage===v?'on':'')+'" data-stage="'+v+'">'+labels[v]+'</button>').join('')+'</div><div class="controls"><button id="pause">'+(s.paused?'继续课堂':'暂停课堂')+'</button><button id="next">下一环节</button><button class="end" id="end">结束课堂</button></div></section>'}
function classes(){try{var rows=JSON.parse(localStorage.getItem('yunting-class-groups-v1'));return Array.isArray(rows)?rows:[]}catch(e){return[]}}
function studentCount(classId){try{var rows=JSON.parse(localStorage.getItem('yunting-class-students-v1'));return Array.isArray(rows)?rows.filter(function(x){return x.classId===classId}).length:0}catch(e){return 0}}
function classPicker(){var rows=classes();if(!rows.length)return '<section class="empty"><b>还没有可选班级</b><p>请先到班级管理中创建班级。</p><a class="class-add-link" href="teacher.html?view=classes">去班级管理 →</a></section>';return '<label>上课班级 <small>可多选</small><div class="class-select"><button type="button" class="class-select-toggle" id="class-select-toggle" aria-expanded="false"><span id="class-select-label">请选择班级</span><i>⌄</i></button><div id="class-select-menu" class="class-select-menu hidden">'+rows.map(function(x){var grade=x.grade||'未设置年级';return '<label class="class-choice"><input type="checkbox" data-class-pick value="'+x.id+'" data-count="'+studentCount(x.id)+'" data-name="'+x.name+'" data-grade="'+grade+'"><span>'+grade+' · '+x.name+'</span></label>'}).join('')+'<button type="button" class="class-select-done" id="class-select-done">完成选择，继续选课程</button></div></div><a class="class-add-link" href="teacher.html?view=classes">管理班级 →</a></label>'}
function courseOptionsFor(grades){var names=Array.from(new Set(grades));if(!names.length)return '<label class="course-placeholder">上课课程<select id="course" disabled><option>请先选择班级</option></select><small class="course-help">选择班级后，会显示该年级可以开课的课程。</small></label>';if(names.length!==1)return '<label class="course-placeholder">上课课程<select id="course" disabled><option>不同年级不能共用同一门年级课程</option></select><small class="course-help">请只选择同一年级的班级。</small></label>';var lib=window.COURSE_LIBRARY||{stages:[]},items=[],picked=pending();lib.stages.forEach(function(stage){stage.grades.forEach(function(g){if(g.name===names[0])g.courses.forEach(function(c){if(c.courseId)items.push(c)})})});if(!items.length)return '<label class="course-placeholder">上课课程<select id="course" disabled><option>'+names[0]+' 暂无可开课课程</option></label>';var valid=items.some(function(c){return c.courseId===picked.id});return '<label>上课课程<select id="course">'+items.map(function(c){return '<option value="'+c.courseId+'" data-title="'+c.title+'"'+(valid&&c.courseId===picked.id?' selected':'')+'>'+c.title+'</option>'}).join('')+'</select><small class="course-help">可在这里更换本次实际要上的课程。</small></label>'}
function pending(){try{return JSON.parse(localStorage.getItem('yunting-pending-course-v1'))||{id:'lesson-01',title:'走进初中，拥抱新起点'}}catch(e){return{id:'lesson-01',title:'走进初中，拥抱新起点'}}}
function launch(){var p=pending();return '<section class="panel"><p class="eyebrow">安排课堂</p><h2>选择班级、课程和推进方式</h2><p class="sub">从课程管理带入：<b>'+p.title+'</b>。你仍可在下面的课程选项中更换本次课程。</p><div class="pick">'+classPicker()+'<div id="course-slot">'+courseOptionsFor([])+'</div><label>课堂推进方式<div class="mode-picker"><label class="mode-option"><input type="radio" name="progress-mode" value="teacher" checked><b>老师统一控制</b><span>学生完成当前环节后等待，由老师带大家一起进入下一环节。</span></label><label class="mode-option"><input type="radio" name="progress-mode" value="student"><b>学生自主探索</b><span>老师开始课堂后，学生可以按自己的节奏完成并进入下一环节。</span></label></div></label></div><button class="launch" id="launch">创建课堂</button><p class="notice">当前为同一浏览器的前端流程模拟。真实班级配对、跨设备推送、登录与权限需接入后端实时服务。</p></section>'}
function courseLibrary(){var lib=window.COURSE_LIBRARY||{stages:[],specials:[]},html='<section class="panel course-library"><p class="eyebrow">完整课程大纲</p><h2>课程管理</h2><p class="sub">按学段与年级浏览。每张卡片是一节独立课程；已完成内容包可直接进入开课准备。</p><div class="course-toolbar"><label>查看年级 <select id="course-grade-filter"><option value="all">全部年级</option><option value="七年级">七年级</option><option value="八年级">八年级</option><option value="九年级">九年级</option><option value="高一">高一</option><option value="高二">高二</option><option value="高三">高三</option></select></label><span>已完成课程可直接选课</span></div>';lib.stages.forEach(function(stage){html+='<section class="course-stage"><header class="course-stage-head"><div><p class="eyebrow">'+stage.name+'</p><p>'+stage.blurb+'</p></div></header>';stage.grades.forEach(function(grade){html+='<section class="course-grade" data-grade="'+grade.name+'"><div class="course-grade-head"><div><b>'+grade.name+'</b><span>'+grade.core+'</span></div><small>'+grade.courses.length+' 节课程</small></div><div class="course-grid">';grade.courses.forEach(function(course,i){var ready=!!course.courseId,action=ready?'<button class="course-choose" data-course="'+course.courseId+'" data-title="'+course.title+'">选课 →</button>':'<span class="course-planned">内容建设中</span>';html+='<article class="course-card '+(ready?'is-ready':'')+'"><span class="course-icon course-icon-'+(i%5)+'">'+(ready?'课':'案')+'</span><div class="course-card-copy"><span class="course-order">第 '+String(course.order).padStart(2,'0')+' 节</span><h3>'+course.title+'</h3><p>'+course.summary+'</p><footer>'+action+'</footer></div></article>'});html+='</div></section>'});html+='</section>'});html+='<section class="course-stage specials"><header class="course-stage-head"><div><p class="eyebrow">全学段通用专项</p><p>可结合学校主题活动与班级实际需要安排。</p></div></header><div class="course-grid">';lib.specials.forEach(function(x,i){html+='<article class="course-card special-card"><span class="course-icon course-icon-'+(i%5)+'">专</span><div class="course-card-copy"><span class="course-order">通用专项</span><h3>'+x.name+'</h3><p>'+x.summary+'</p><footer><span class="course-planned">专项课程规划</span></footer></div></article>'});return html+'</div></section><p class="boundary">课程大纲用于老师选课与排课。学生端只会进入老师当次开放的完整课堂。</p></section>'}

function bind(){var recoverButton=document.getElementById('recover-class');if(recoverButton)recoverButton.onclick=function(){var s=YTClassroomDemo.read();if(!(s.status==='ended'&&s.endedAt&&Date.now()-s.endedAt<600000))return;s.active=true;s.status='live';s.endedAt=null;YTClassroomDemo.write(s);var rows=all().filter(function(x){return x.sessionId!==s.sessionId});rows.unshift({sessionId:s.sessionId,title:s.courseTitle,className:s.className,at:s.startedAt||s.createdAt,status:'进行中',expectedStudents:s.expectedStudents,actualStudents:s.actualStudents,reachedStages:s.reachedStages||[],demo:true});localStorage.setItem('yunting-class-records-v1',JSON.stringify(rows.slice(0,20)));location.href='teacher-course.html?session='+encodeURIComponent(s.sessionId)};var inbox=document.getElementById('support-inbox');if(inbox)YTSupportFlow.bindInbox(inbox,page);var classList=document.getElementById('class-list');if(classList){var rows=classes();classList.innerHTML=rows.length?rows.map(function(x){return '<a class="record" style="display:block;color:inherit;text-decoration:none" href="teacher-class.html?class='+encodeURIComponent(x.id)+'"><b>'+(x.grade?x.grade+' · ':'')+x.name+'</b></a>'}).join(''):'<div class="empty">暂未创建班级</div>'};var courseGradeFilter=document.getElementById('course-grade-filter');if(courseGradeFilter){courseGradeFilter.onchange=function(){var picked=courseGradeFilter.value;main.querySelectorAll('.course-grade').forEach(function(group){group.hidden=picked!=='all'&&group.dataset.grade!==picked});main.querySelectorAll('.course-stage').forEach(function(stage){var groups=Array.from(stage.querySelectorAll('.course-grade'));if(groups.length)stage.hidden=groups.every(function(group){return group.hidden});else if(stage.classList.contains('specials'))stage.hidden=picked!=='all'})}}main.querySelectorAll('[data-course]').forEach(function(choice){choice.onclick=function(){localStorage.setItem('yunting-pending-course-v1',JSON.stringify({id:choice.dataset.course,title:choice.dataset.title}));location.href='teacher.html?view=launch'}});var picks=Array.from(main.querySelectorAll('[data-class-pick]')),slot=document.getElementById('course-slot'),selectToggle=document.getElementById('class-select-toggle'),selectMenu=document.getElementById('class-select-menu'),selectLabel=document.getElementById('class-select-label');function syncCourses(){var chosen=picks.filter(function(x){return x.checked});if(slot)slot.innerHTML=courseOptionsFor(chosen.map(function(x){return x.dataset.grade}));if(selectLabel)selectLabel.textContent=chosen.length?chosen.map(function(x){return x.dataset.grade+' · '+x.dataset.name}).join('、'):'请选择班级'}if(selectToggle)selectToggle.onclick=function(){var open=selectMenu.classList.toggle('hidden')===false;selectToggle.setAttribute('aria-expanded',String(open))};var selectDone=document.getElementById('class-select-done');if(selectDone)selectDone.onclick=function(){selectMenu.classList.add('hidden');selectToggle.setAttribute('aria-expanded','false');var course=document.getElementById('course');if(course&&!course.disabled)course.focus()};picks.forEach(function(x){x.onchange=syncCourses});syncCourses();var b=document.getElementById('launch');if(b)b.onclick=function(){var selected=Array.from(main.querySelectorAll('[data-class-pick]:checked')),co=document.getElementById('course');if(!selected.length){alert('请至少选择一个上课班级');return}if(!co||co.disabled){alert('请为所选年级选择可开课的课程');return}var o=co.options[co.selectedIndex],mode=(main.querySelector('input[name="progress-mode"]:checked')||{}).value||'teacher',now=Date.now(),sessionId='demo-'+now,next={active:true,status:'waiting',progressMode:mode,studentStage:'enter',sessionId:sessionId,classId:selected.map(function(x){return x.value}).join(','),className:selected.map(function(x){return x.dataset.name}).join('、'),expectedStudents:selected.reduce(function(n,x){return n+(Number(x.dataset.count)||0)},0),actualStudents:null,presenceMode:'not-connected',courseId:co.value,courseTitle:o.dataset.title,teacherId:'teacher-demo-01',createdAt:now,startedAt:null,stageStartedAt:null,stage:'enter',reachedStages:[],studentProgress:{},paused:false};YTClassroomDemo.write(next);var r=all().filter(function(x){return x.sessionId!==sessionId});r.unshift({sessionId:sessionId,title:next.courseTitle,className:next.className,at:now,status:'等待开始',expectedStudents:next.expectedStudents,actualStudents:null,reachedStages:[],demo:true});localStorage.setItem('yunting-class-records-v1',JSON.stringify(r.slice(0,20)));location.href='teacher-course.html?session='+encodeURIComponent(sessionId)};main.querySelectorAll('[data-stage]').forEach(b=>b.onclick=function(){var s=YTClassroomDemo.read();s.stage=b.dataset.stage;s.paused=false;YTClassroomDemo.write(s);page()});var s=YTClassroomDemo.read(),p=document.getElementById('pause'),n=document.getElementById('next'),e=document.getElementById('end');if(p)p.onclick=()=>{s.paused=!s.paused;YTClassroomDemo.write(s);page()};if(n)n.onclick=()=>{var i=stages.indexOf(s.stage);if(i<stages.length-1){s.stage=stages[i+1];s.stageStartedAt=Date.now();s.reachedStages=Array.from(new Set((s.reachedStages||[]).concat(s.stage)));s.paused=false;YTClassroomDemo.write(s);page()}};if(e)e.onclick=()=>{if(!confirm('确认结束本次课堂？结束后可在课堂记录中查看，并可在 10 分钟内恢复。'))return;s.active=false;s.status='ended';s.endedAt=Date.now();YTClassroomDemo.write(s);var r=all().filter(function(x){return x.sessionId!==s.sessionId});r.unshift({sessionId:s.sessionId,title:s.courseTitle,className:s.className,at:s.startedAt,status:'已结束',endedAt:s.endedAt,expectedStudents:s.expectedStudents,actualStudents:s.actualStudents,reachedStages:s.reachedStages||[s.stage],demo:true});localStorage.setItem('yunting-class-records-v1',JSON.stringify(r.slice(0,20)));page()}}var lastClassroom='';YTClassroomDemo.subscribe(function(){var x=YTClassroomDemo.read(),sig=[x.sessionId,x.active,x.stage,x.paused,x.updatedAt].join('|');if(sig!==lastClassroom){lastClassroom=sig;page();}});page();
