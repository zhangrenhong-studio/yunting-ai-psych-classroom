<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云听｜班级详情</title><style>
:root{--bg1:#f0fdf4;--bg2:#e0f2fe;--bg3:#faf5ff;--ink:#23424c;--muted:#708992;--line:#dbece8;--teal:#168677;--sky:#edf8ff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -20%,var(--bg1),var(--bg2) 52%,var(--bg3));min-height:100vh}.shell{width:min(980px,calc(100% - 44px));margin:auto;padding:28px 0 42px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-weight:900}.back{color:var(--teal);text-decoration:none;font-size:13px}.hero,.panel{padding:26px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 20px 42px -38px rgba(17,88,80,.46)}.eyebrow{margin:0 0 8px;color:var(--teal);font-size:11px;font-weight:900;letter-spacing:.14em}h1,h2{margin:0;letter-spacing:-.04em}h1{font-size:32px}h2{font-size:20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.button{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border:1px solid #b7ddd3;border-radius:12px;background:#fff;color:var(--teal);font-weight:800;text-decoration:none}.button.primary{border-color:var(--teal);background:var(--teal);color:#fff}.panel{margin-top:18px}.student{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sky);color:var(--teal);font-weight:900}.student b,.student span{display:block}.student span{font-size:12px;color:var(--muted)}.empty{padding:40px 14px;text-align:center;color:var(--muted)}.metric{display:inline-flex;gap:6px;align-items:baseline;margin-top:12px;color:var(--muted)}.metric b{font-size:24px;color:var(--ink)}@media(max-width:650px){.shell{width:min(100% - 28px,980px);padding-top:18px}.hero,.panel{padding:21px}h1{font-size:27px}.actions{display:grid;grid-template-columns:1fr}.button{width:100%}}</style><link rel="stylesheet" href="assets/teacher-ui.css?v=unified-2"></head><body><main class="shell"><header class="top"><div class="brand">云听 <span style="font-size:12px;color:var(--teal)">班级管理</span></div><a class="back" href="teacher.html?view=classes">← 班级管理</a></header><section id="app"></section></main><script src="assets/demo-data.js?v=demo-1"></script><script>
window.YTSeedDemo&&window.YTSeedDemo.ensure();
(function(){var classId=new URLSearchParams(location.search).get('class'),CLASS_KEY='yunting-class-groups-v1',STUDENT_KEY='yunting-class-students-v1';function read(key){try{var rows=JSON.parse(localStorage.getItem(key));return Array.isArray(rows)?rows:[]}catch(e){return[]}}function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}var group=read(CLASS_KEY).find(function(x){return x.id===classId});if(!group){document.getElementById('app').innerHTML='<section class="hero empty"><b>未找到这个班级</b><p><a class="back" href="teacher.html?view=classes">返回班级管理</a></p></section>';return}var students=read(STUDENT_KEY).filter(function(x){return x.classId===group.id});var title=(group.grade?group.grade+' · ':'')+group.name;var body='<section class="hero"><p class="eyebrow">班级详情</p><h1>'+esc(title)+'</h1><span class="metric"><b>'+students.length+'</b> 名学生</span><div class="actions"><a class="button primary" href="teacher-student-add.html?class='+encodeURIComponent(group.id)+'">+ 添加学生</a><a class="button" href="teacher-students-import.html?class='+encodeURIComponent(group.id)+'">导入学生</a></div></section><section class="panel"><p class="eyebrow">学生名单</p><h2>学生</h2>';body+=students.length?students.map(function(x){return '<article class="student"><i class="avatar">'+esc(x.name).slice(0,1)+'</i><div><b>'+esc(x.name)+'</b><span>'+ (x.studentNo?'学号：'+esc(x.studentNo):'未填写学号')+'</span></div></article>'}).join(''):'<div class="empty">暂未添加学生</div>';body+='</section>';document.getElementById('app').innerHTML=body})();
</script><script src="assets/teacher-ui.js?v=unified-2"></script></body></html>
