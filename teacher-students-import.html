<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云听｜导入学生</title><style>body{margin:0;min-height:100vh;color:#23424c;font:15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -20%,#f0fdf4,#e0f2fe 52%,#faf5ff)}*{box-sizing:border-box}.shell{width:min(680px,calc(100% - 36px));margin:auto;padding:34px 0}.top{display:flex;justify-content:space-between;margin-bottom:28px}.brand{font-weight:900}.back{color:#168677;text-decoration:none;font-size:13px}.card{padding:30px;border:1px solid #dbece8;border-radius:24px;background:rgba(255,255,255,.9);box-shadow:0 22px 48px -40px rgba(17,88,80,.5)}.eyebrow{margin:0 0 8px;color:#168677;font-size:11px;font-weight:900;letter-spacing:.15em}h1{margin:0;font-size:29px;letter-spacing:-.04em}p{color:#708992}.upload{display:grid;place-items:center;min-height:145px;margin:22px 0;border:1.5px dashed #a9d6cc;border-radius:16px;background:#f8fdfb;cursor:pointer;text-align:center}.upload input{display:none}.upload b,.upload span{display:block}.upload span{font-size:12px;color:#708992}.preview{margin-top:18px;padding:15px;border-radius:14px;background:#edf8ff}.submit{width:100%;margin-top:16px;padding:14px;border:0;border-radius:13px;background:#168677;color:white;font:800 15px inherit}.submit:disabled{opacity:.5}.error{min-height:18px;margin:10px 0 0;color:#bb3c57;font-size:13px}.ok{padding:13px;border-radius:13px;background:#eafbf3;color:#247760}.hidden{display:none}</style><link rel="stylesheet" href="assets/teacher-ui.css?v=unified-2"></head><body><main class="shell"><header class="top"><div class="brand">云听</div><a class="back" id="back">← 返回班级</a></header><section class="card"><p class="eyebrow">班级学生</p><h1 id="title">导入学生</h1><p>上传 CSV 或 TXT 文件，每行一名学生，格式：<b>姓名,学号</b>。首行“姓名,学号”会自动跳过。</p><label class="upload"><input id="file" type="file" accept=".csv,.txt,text/csv,text/plain"><div><b>选择名单文件</b><span id="file-name">CSV / TXT</span></div></label><div class="preview" id="preview">尚未选择文件</div><p class="error" id="error"></p><button class="submit" id="submit" disabled>导入学生</button><p id="ok" class="ok hidden"></p></section></main><script src="assets/demo-data.js?v=demo-1"></script><script>window.YTSeedDemo&&window.YTSeedDemo.ensure();(function(){var id=new URLSearchParams(location.search).get('class'),CK='yunting-class-groups-v1',SK='yunting-class-students-v1',chosen=[],back=document.getElementById('back');back.href='teacher-class.html?class='+encodeURIComponent(id||'');function read(k){try{var x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:[]}catch(e){return[]}}var c=read(CK).find(function(x){return x.id===id});if(c)document.getElementById('title').textContent='导入学生 · '+(c.grade?c.grade+' · ':'')+c.name;function parse(text){return text.replace(/^\uFEFF/,'').split(/\r?\n/).map(function(line){return line.trim()}).filter(Boolean).map(function(line){var a=line.split(/[，,\t]/).map(function(x){return x.trim()});return {name:a[0],studentNo:a[1]||''}}).filter(function(x){return x.name&&x.name!=='姓名'})}document.getElementById('file').onchange=function(e){var f=e.target.files[0];if(!f)return;document.getElementById('file-name').textContent=f.name;var r=new FileReader();r.onload=function(){chosen=parse(String(r.result||''));document.getElementById('preview').textContent=chosen.length?'将导入 '+chosen.length+' 名学生：'+chosen.slice(0,5).map(function(x){return x.name}).join('、')+(chosen.length>5?' 等':''):'未识别到有效学生名单';document.getElementById('submit').disabled=!chosen.length};r.readAsText(f,'utf-8')};document.getElementById('submit').onclick=function(){var error=document.getElementById('error');error.textContent='';if(!c){error.textContent='未找到班级。';return}var rows=read(SK),existing=new Set(rows.filter(function(x){return x.classId===id}).map(function(x){return (x.studentNo?'no:'+x.studentNo:'name:'+x.name)})),added=0;chosen.forEach(function(x){var k=x.studentNo?'no:'+x.studentNo:'name:'+x.name;if(existing.has(k))return;existing.add(k);rows.push({id:'student-'+Date.now()+'-'+added,classId:id,name:x.name,studentNo:x.studentNo,createdAt:new Date().toISOString()});added++});localStorage.setItem(SK,JSON.stringify(rows));document.getElementById('ok').textContent='已导入 '+added+' 名学生';document.getElementById('ok').classList.remove('hidden');setTimeout(function(){location.href=back.href},450)}})();</script><script src="assets/teacher-ui.js?v=unified-2"></script></body></html>
