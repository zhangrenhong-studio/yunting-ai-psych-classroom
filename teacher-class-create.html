<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云听｜创建班级</title><style>
:root{--bg1:#f0fdf4;--bg2:#e0f2fe;--bg3:#faf5ff;--ink:#23424c;--muted:#708992;--line:#dbece8;--teal:#168677}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -20%,var(--bg1),var(--bg2) 52%,var(--bg3))}.shell{width:min(620px,calc(100% - 36px));margin:auto;padding:34px 0}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-weight:900;letter-spacing:.02em}.back{color:var(--teal);font-size:13px;text-decoration:none}.card{padding:32px;border:1px solid rgba(219,236,232,.95);border-radius:26px;background:rgba(255,255,255,.88);box-shadow:0 24px 52px -43px rgba(17,88,80,.45)}.eyebrow{margin:0 0 8px;color:var(--teal);font-size:11px;font-weight:900;letter-spacing:.15em}h1{margin:0 0 25px;font-size:30px;letter-spacing:-.045em}.form{display:grid;gap:16px}label{display:grid;gap:8px;font-weight:750}input,select{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);font:inherit}input:focus,select:focus{outline:3px solid #d5f5eb;border-color:#62cbae}.hint{margin:-6px 0 0;color:var(--muted);font-size:12px}.submit{margin-top:8px;border:0;border-radius:13px;padding:14px 18px;background:linear-gradient(135deg,#34d399,#168677);color:white;font:800 15px inherit;cursor:pointer}.error{min-height:18px;margin:0;color:#bb3c57;font-size:13px}.ok{padding:13px;border-radius:13px;background:#eafbf3;color:#247760}.hidden{display:none}@media(max-width:600px){.shell{width:min(100% - 26px,620px);padding-top:20px}.card{padding:24px}h1{font-size:27px}}</style><link rel="stylesheet" href="assets/teacher-ui.css?v=unified-2"></head><body><main class="shell"><header class="top"><div class="brand">云听</div><a class="back" href="teacher.html?view=classes">← 班级管理</a></header><section class="card"><p class="eyebrow">班级管理</p><h1>创建班级</h1><form id="form" class="form"><label>年级<select id="grade" required><option value="七年级">七年级</option><option value="八年级">八年级</option><option value="九年级">九年级</option><option value="高一">高一</option><option value="高二">高二</option><option value="高三">高三</option></select></label><p class="hint">年级用于匹配可安排的课程。</p><label>班级名称<input id="name" required maxlength="30" placeholder="例如：向阳班、1 班、星辰班" autofocus></label><p class="error" id="error"></p><button class="submit" type="submit">创建班级</button></form><p id="ok" class="ok hidden"></p></section></main><script src="assets/demo-data.js?v=demo-1"></script><script>
window.YTSeedDemo&&window.YTSeedDemo.ensure();
(function(){var key='yunting-class-groups-v1',form=document.getElementById('form'),grade=document.getElementById('grade'),input=document.getElementById('name'),error=document.getElementById('error');function read(){try{var rows=JSON.parse(localStorage.getItem(key));return Array.isArray(rows)?rows:[]}catch(e){return[]}}form.addEventListener('submit',function(e){e.preventDefault();var className=input.value.trim(),rows=read();error.textContent='';if(!className){error.textContent='请填写班级名称。';return}if(rows.some(function(x){return x.grade===grade.value&&x.name===className})){error.textContent='该年级下已存在同名班级。';return}rows.push({id:'class-'+Date.now(),name:className,grade:grade.value,createdAt:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(rows));document.getElementById('ok').textContent='已创建“'+grade.value+' · '+className+'”';document.getElementById('ok').classList.remove('hidden');setTimeout(function(){location.href='teacher.html?view=classes'},450)})})();
</script><script src="assets/teacher-ui.js?v=unified-2"></script></body></html>
